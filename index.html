<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecco PIM</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#f3f2ef; --text:#1d1d1b; --muted:#85837d; --faint:#b9b6af;
  --line:#e3e1dc; --accent:#2f6fde; --accent-bg:#e8effc; --hover:#ecebe6;
  --done:#9a978f; --warn-bg:#fff4d6; --warn:#7a5a00; --session:#5641b8; --session-bg:#f1eefc;
  --pill:#eceae4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1c1e; --panel:#222326; --text:#e6e5e1; --muted:#8f8d88; --faint:#5d5c58;
    --line:#33343a; --accent:#6b9cff; --accent-bg:#26324a; --hover:#2b2c30;
    --done:#77756f; --warn-bg:#3a3220; --warn:#e8c56a; --session:#ab9dff; --session-bg:#2a2640;
    --pill:#2e2f34;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1c1e; --panel:#222326; --text:#e6e5e1; --muted:#8f8d88; --faint:#5d5c58;
  --line:#33343a; --accent:#6b9cff; --accent-bg:#26324a; --hover:#2b2c30;
  --done:#77756f; --warn-bg:#3a3220; --warn:#e8c56a; --session:#ab9dff; --session-bg:#2a2640;
  --pill:#2e2f34;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 6px}

/* Sidebar */
#side{width:250px;min-width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
#side .top{padding:12px 12px 6px;display:flex;align-items:center;gap:6px}
#side .brand{font-weight:700;letter-spacing:.2px;flex:1}
#side .new{display:flex;gap:6px;padding:0 12px 8px}
#side .new button{flex:1}
#filter{margin:0 12px 8px;width:calc(100% - 24px)}
#lists{flex:1;overflow:auto;padding-bottom:8px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 14px 3px;font-weight:600}
.item{display:flex;gap:6px;align-items:baseline;padding:2px 14px;cursor:pointer;white-space:nowrap;overflow:hidden}
.item:hover{background:var(--hover)}
.item.cur{background:var(--accent-bg)}
.item .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:11px;color:var(--muted)}
.empty-note{color:var(--muted);font-size:12px;padding:2px 14px}
#side .foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
#status{color:var(--muted);flex:1 0 100%}
#status.err{color:#d33}

/* Main */
#main{flex:1;height:100%;overflow:auto;display:flex;flex-direction:column}
#banner{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:5px 24px;display:flex;gap:10px;align-items:center}
#banner[hidden]{display:none}
#content{padding:16px 28px 120px;width:100%}
.head .title{font-size:20px;font-weight:650;border:none;background:transparent;width:100%;padding:2px 0;outline:none}
.head .title::placeholder{color:var(--faint)}
.head .sub{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.head .sub select{font-size:12.5px;max-width:200px;padding:0 4px}
.head .sub .go{border:none;color:var(--accent);padding:0 3px}
.head .sub .del{margin-left:auto;font-size:12px;color:var(--muted)}

.strip{border:1px solid var(--line);border-radius:7px;margin:0 0 12px;padding:6px 10px;background:var(--panel)}
.strip .h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:2px}
.strip .oi{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.strip .oi .t{cursor:pointer;flex:1}
.strip .oi .t:hover{text-decoration:underline}
.strip .none{color:var(--muted);font-size:12.5px}

/* Outline */
.outline{max-width:1100px}
.node{position:relative}
.kids{margin-left:11px;padding-left:10px;border-left:1px solid var(--line)}
.row{display:flex;align-items:flex-start;gap:4px;min-height:22px;border-radius:4px;padding:0 4px}
.row:hover{background:var(--hover)}
.tw{width:14px;flex:0 0 14px;text-align:center;color:var(--faint);font-size:11px;line-height:22px;user-select:none}
.tw.has{cursor:pointer;color:var(--muted)}
.tw.has:hover{color:var(--text)}
.ck{margin:5px 2px 0 0;opacity:0;cursor:pointer;flex:0 0 auto}
.row:hover .ck,.ck.show,.ck:focus{opacity:1}
.tx{flex:1;outline:none;min-width:40px;line-height:22px;white-space:pre-wrap;word-break:break-word}
.tx:empty:before{content:attr(data-ph);color:var(--faint)}
.tx a{color:var(--accent);text-decoration:underline;cursor:pointer}
.row.done .tx{text-decoration:line-through;color:var(--done)}
.meta{flex:0 0 auto;display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--muted);line-height:22px;white-space:nowrap}
.pill{background:var(--pill);border-radius:9px;padding:0 7px;line-height:17px}
.row.session{margin-top:10px;background:var(--session-bg)}
.row.session .sdate{font-weight:650;color:var(--session);line-height:22px;margin-right:8px;white-space:nowrap;cursor:pointer}
.row.session .sdate:hover{text-decoration:underline}
.row.session .tx{color:var(--muted)}
.node.flash>.row{animation:flash 1.2s}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}

/* Popover */
#pop{position:fixed;z-index:10;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;font-size:13px;display:none;min-width:230px}
#pop label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
#pop .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}

/* Empty state */
.welcome{max-width:620px;color:var(--muted);margin-top:40px}
.welcome h2{color:var(--text);font-size:18px;margin:0 0 8px}
.welcome table{border-collapse:collapse;margin-top:12px;font-size:13px}
.welcome td{padding:2px 14px 2px 0}
.welcome kbd{background:var(--pill);border-radius:4px;padding:0 5px;font:12px ui-monospace,Consolas,monospace;color:var(--text)}
</style>
</head>
<body>
<aside id="side">
  <div class="top"><span class="brand">Ecco PIM</span></div>
  <div class="new">
    <button id="newMeeting" title="New meeting item">+ Meeting</button>
    <button id="newDoc" title="New document">+ Document</button>
  </div>
  <input id="filter" placeholder="Filter titles…" autocomplete="off">
  <div id="lists"></div>
  <div class="foot">
    <button id="exportBtn" title="Download a complete backup file">Export</button>
    <button id="importBtn" title="Restore from a backup file">Import</button>
    <button id="themeBtn" title="Theme">Theme: system</button>
    <span id="status">Saved</span>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</aside>
<main id="main">
  <div id="banner" hidden></div>
  <div id="content"></div>
</main>
<div id="pop"></div>

<script>
(function(){
'use strict';

/* ---------- utilities ---------- */
const KEY = 'eccopim.v1';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = (s, opt) => s ? parseISO(s).toLocaleDateString(undefined, opt || { month: 'short', day: 'numeric' }) : '';
const fmtLong = s => fmt(s, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = t => esc(t || '').replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const $ = s => document.querySelector(s);

/* ---------- state ---------- */
function blank() { return { version: 1, containers: {}, bullets: {}, ui: { current: null, lastExport: null, theme: null } }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.containers && o.bullets) { o.ui = o.ui || {}; return o; } }
  } catch (e) { /* storage unavailable */ }
  return null;
}
let S = load() || blank();

let saveTimer = null;
function setStatus(msg, err) { const s = $('#status'); s.textContent = msg; s.classList.toggle('err', !!err); }
function save() {
  setStatus('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); setStatus('Saved in this browser'); }
    catch (e) { setStatus('Save failed. Export a backup now.', true); }
  }, 250);
}
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} });

/* ---------- undo / redo ---------- */
let undoStack = [], redoStack = [], typingSnap = false, typingTimer = null;
const snapshot = () => JSON.stringify({ c: S.containers, b: S.bullets });
function snap() { undoStack.push(snapshot()); if (undoStack.length > 150) undoStack.shift(); redoStack.length = 0; typingSnap = false; }
function restoreFrom(str) {
  const o = JSON.parse(str); S.containers = o.c; S.bullets = o.b;
  if (S.ui.current && !S.containers[S.ui.current]) S.ui.current = null;
  save(); renderAll();
}
function undo() { if (!undoStack.length) return; const f = focusInfo(); redoStack.push(snapshot()); restoreFrom(undoStack.pop()); refocus(f); }
function redo() { if (!redoStack.length) return; const f = focusInfo(); undoStack.push(snapshot()); restoreFrom(redoStack.pop()); refocus(f); }

/* ---------- model helpers ---------- */
function kidsIndex(cid) {
  const m = new Map();
  for (const b of Object.values(S.bullets)) {
    if (b.containerId !== cid) continue;
    const k = b.parentId || '_';
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(b);
  }
  for (const a of m.values()) a.sort((x, y) => x.order - y.order);
  return m;
}
const childList = (pid, cid) => Object.values(S.bullets).filter(x => x.containerId === cid && (x.parentId || null) === (pid || null)).sort((a, b) => a.order - b.order);
const siblings = b => childList(b.parentId, b.containerId);
function orderAfter(b) { const s = siblings(b); const n = s[s.indexOf(b) + 1]; return n ? (b.order + n.order) / 2 : b.order + 1; }
function orderFirst(pid, cid) { const k = childList(pid, cid); return k.length ? k[0].order - 1 : 0; }
function orderLast(pid, cid) { const k = childList(pid, cid); return k.length ? k[k.length - 1].order + 1 : 0; }
function newBullet(cid, pid, order, extra) {
  const b = Object.assign({ id: uid(), containerId: cid, parentId: pid || null, order, text: '', isSession: false, date: null, start: null, end: null, done: false, doneAt: null, links: [], collapsed: false, created: new Date().toISOString() }, extra || {});
  S.bullets[b.id] = b; return b;
}
function deleteTree(id) { for (const k of Object.values(S.bullets).filter(x => x.parentId === id)) deleteTree(k.id); delete S.bullets[id]; }
function treeEmpty(id) { const b = S.bullets[id]; if ((b.text || '').trim()) return false; return Object.values(S.bullets).filter(x => x.parentId === id).every(k => treeEmpty(k.id)); }
function sessionsOf(cid) { return Object.values(S.bullets).filter(b => b.containerId === cid && b.isSession); }
function hasTask(b) { return !!(b.done || b.start || b.end || (b.links && b.links.length)); }
function effDate(b) { let x = b; while (x) { if (x.isSession) return x.date; x = x.parentId ? S.bullets[x.parentId] : null; } const c = S.containers[b.containerId]; return c ? c.created : null; }

/* ---------- containers ---------- */
function createContainer(type) {
  snap();
  const c = { id: uid(), type, title: '', created: todayISO(), prev: null, next: null };
  S.containers[c.id] = c;
  openContainer(c.id, true);
}
function cleanupEmptySession(cid) {
  const c = S.containers[cid]; if (!c || c.type !== 'meeting') return;
  for (const s of sessionsOf(cid)) if (s.date === todayISO() && treeEmpty(s.id)) deleteTree(s.id);
}
function openContainer(id, focusTitle) {
  if (S.ui.current && S.ui.current !== id) cleanupEmptySession(S.ui.current);
  S.ui.current = id;
  const c = S.containers[id];
  let focusId = null;
  if (c.type === 'meeting') {
    const today = todayISO();
    let s = sessionsOf(id).find(x => x.date === today);
    if (!s) {
      for (const o of sessionsOf(id)) o.collapsed = true;
      s = newBullet(id, null, orderFirst(null, id), { isSession: true, date: today });
    }
    s.collapsed = false;
    let k = childList(s.id, id);
    if (!k.length) k = [newBullet(id, s.id, 0)];
    focusId = k[k.length - 1].id;
  } else {
    let k = childList(null, id);
    if (!k.length) k = [newBullet(id, null, 0)];
    focusId = k[0].id;
  }
  save(); renderAll();
  if (focusTitle) { const t = $('.head .title'); if (t) t.focus(); }
  else refocus({ id: focusId, pos: 'end' });
}
function setChain(a, field, bId) {
  const other = field === 'prev' ? 'next' : 'prev';
  const old = a[field];
  if (old && S.containers[old] && S.containers[old][other] === a.id) S.containers[old][other] = null;
  a[field] = bId || null;
  if (bId) {
    const B = S.containers[bId];
    if (B[other] && B[other] !== a.id && S.containers[B[other]]) S.containers[B[other]][field] = null;
    B[other] = a.id;
  }
}
function deleteContainer(c) {
  if (!confirm('Delete "' + (c.title || 'Untitled') + '" and all its notes?\n(Ctrl+Z undoes this.)')) return;
  snap();
  for (const b of Object.values(S.bullets)) if (b.containerId === c.id) delete S.bullets[b.id];
  setChain(c, 'prev', null); setChain(c, 'next', null);
  delete S.containers[c.id];
  S.ui.current = null; save(); renderAll();
}

/* ---------- focus & caret ---------- */
function getCaret(node) {
  const s = getSelection(); if (!s.rangeCount) return 0;
  const r = s.getRangeAt(0); if (!node.contains(r.startContainer)) return 0;
  const pre = r.cloneRange(); pre.selectNodeContents(node); pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length;
}
function setCaret(node, pos) {
  const len = node.textContent.length;
  if (pos === 'end' || pos > len) pos = len;
  const r = document.createRange();
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  let n, left = pos, placed = false;
  while ((n = walker.nextNode())) { if (left <= n.length) { r.setStart(n, left); placed = true; break; } left -= n.length; }
  if (!placed) { r.selectNodeContents(node); r.collapse(false); } else r.collapse(true);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function focusInfo() {
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains('tx')) { const n = a.closest('.node'); return { id: n.dataset.id, pos: getCaret(a) }; }
  return null;
}
function txOf(id) { const n = document.querySelector('.node[data-id="' + id + '"]'); return n ? n.querySelector(':scope > .row > .tx') : null; }
function refocus(f) {
  if (!f) return;
  const t = txOf(f.id); if (!t) return;
  t.focus(); setCaret(t, f.pos);
  t.scrollIntoView({ block: 'nearest' });
}
function caretAtEdge(node, up) {
  const s = getSelection(); if (!s.rangeCount) return true;
  const r = s.getRangeAt(0).cloneRange(); r.collapse(true);
  const rect = r.getClientRects()[0]; if (!rect) return true;
  const er = node.getBoundingClientRect();
  const lh = parseFloat(getComputedStyle(node).lineHeight) || 22;
  return up ? rect.top - er.top < lh * 0.8 : er.bottom - rect.bottom < lh * 0.8;
}
function commit(focusId, pos) { save(); renderMain(); refocus({ id: focusId, pos }); }

/* ---------- rendering ---------- */
function applyTheme() {
  const t = S.ui.theme;
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  $('#themeBtn').textContent = 'Theme: ' + (t || 'system');
}
function renderAll() { applyTheme(); renderSidebar(); renderBanner(); renderMain(); }

function renderSidebar() {
  const q = $('#filter').value.trim().toLowerCase();
  const lists = $('#lists'); lists.innerHTML = '';
  const last = {};
  for (const b of Object.values(S.bullets)) if (b.isSession && (!last[b.containerId] || b.date > last[b.containerId])) last[b.containerId] = b.date;
  const all = Object.values(S.containers).filter(c => !q || (c.title || 'untitled').toLowerCase().includes(q));
  const sections = [
    ['Meetings', all.filter(c => c.type === 'meeting').sort((a, b) => (last[b.id] || b.created).localeCompare(last[a.id] || a.created)), c => fmt(last[c.id] || c.created)],
    ['Documents', all.filter(c => c.type === 'document').sort((a, b) => (a.title || '').localeCompare(b.title || '')), () => '']
  ];
  for (const [name, items, dateFn] of sections) {
    const h = el('div', 'sec'); h.textContent = name; lists.appendChild(h);
    if (!items.length) { const e = el('div', 'empty-note'); e.textContent = q ? 'No matches' : 'None yet'; lists.appendChild(e); }
    for (const c of items) {
      const it = el('div', 'item' + (c.id === S.ui.current ? ' cur' : ''));
      const t = el('span', 't'); t.textContent = c.title || 'Untitled';
      const d = el('span', 'd'); d.textContent = dateFn(c);
      it.append(t, d);
      it.onclick = () => openContainer(c.id);
      lists.appendChild(it);
    }
  }
  const note = el('div', 'sec'); note.textContent = 'People & Projects'; lists.appendChild(note);
  const n2 = el('div', 'empty-note'); n2.textContent = 'Arrive in stage 2'; lists.appendChild(n2);
}

function renderBanner() {
  const b = $('#banner');
  const last = S.ui.lastExport ? new Date(S.ui.lastExport) : null;
  const days = last ? (Date.now() - last.getTime()) / 864e5 : Infinity;
  const hasData = Object.keys(S.bullets).length > 0;
  if (hasData && days > 7) {
    b.hidden = false;
    b.innerHTML = '';
    const s = el('span'); s.textContent = 'Stage 1 stores notes only in this browser. ' + (last ? 'Last backup: ' + fmt(isoOf(last)) + '.' : 'No backup yet.');
    const btn = el('button'); btn.textContent = 'Export backup'; btn.onclick = exportData;
    b.append(s, btn);
  } else b.hidden = true;
}

function metaHTML(b, kidCount) {
  const parts = [];
  if (b.start || b.end) {
    const r = b.start && b.end ? (b.start === b.end ? fmt(b.start) : fmt(b.start) + ' – ' + fmt(b.end)) : (b.start ? 'from ' + fmt(b.start) : 'by ' + fmt(b.end));
    parts.push('<span class="pill" title="Right-click to change dates">' + r + '</span>');
  }
  if (b.done && b.doneAt) parts.push('<span title="Completed ' + esc(new Date(b.doneAt).toLocaleString()) + '">✓ ' + fmt(isoOf(new Date(b.doneAt))) + '</span>');
  if (b.collapsed && kidCount) parts.push('<span>(' + kidCount + ')</span>');
  return parts.join('');
}

function nodeEl(b, idx) {
  const kids = idx.get(b.id) || [];
  const n = el('div', 'node'); n.dataset.id = b.id;
  const row = el('div', 'row' + (b.isSession ? ' session' : '') + (b.done ? ' done' : ''));
  const tw = el('span', 'tw');
  if (kids.length) { tw.textContent = b.collapsed ? '▸' : '▾'; tw.classList.add('has'); tw.title = 'Collapse / expand (Ctrl+.)'; }
  else tw.textContent = b.isSession ? '' : '•';
  row.appendChild(tw);
  if (b.isSession) {
    const d = el('span', 'sdate'); d.textContent = fmtLong(b.date); d.title = 'Click to change the date or delete this session'; row.appendChild(d);
  } else {
    const ck = el('input', 'ck' + (hasTask(b) ? ' show' : '')); ck.type = 'checkbox'; ck.checked = !!b.done; ck.tabIndex = -1;
    ck.title = 'Done (Ctrl+Enter)'; row.appendChild(ck);
  }
  const tx = el('div', 'tx'); tx.contentEditable = 'true'; tx.spellcheck = true;
  tx.dataset.ph = b.isSession ? 'Session topic (optional)' : '';
  tx.innerHTML = linkify(b.text);
  row.appendChild(tx);
  const meta = el('span', 'meta'); meta.innerHTML = metaHTML(b, kids.length); row.appendChild(meta);
  n.appendChild(row);
  if (kids.length && !b.collapsed) { const k = el('div', 'kids'); for (const c of kids) k.appendChild(nodeEl(c, idx)); n.appendChild(k); }
  return n;
}

function openItems(c) {
  return Object.values(S.bullets)
    .filter(b => b.containerId === c.id && !b.isSession && !b.done && (b.text || '').trim() && hasTask(b))
    .sort((a, b) => (effDate(b) || '').localeCompare(effDate(a) || ''));
}

function renderMain() {
  const ct = $('#content'); ct.innerHTML = '';
  const c = S.ui.current && S.containers[S.ui.current];
  if (!c) { ct.appendChild(welcome()); return; }

  const head = el('div', 'head');
  const title = el('input', 'title'); title.value = c.title || ''; title.placeholder = c.type === 'meeting' ? 'Meeting title' : 'Document title';
  title.addEventListener('focus', () => snap());

  const mod = e.ctrlKey || e.metaKey;
  const inField = e.target.matches && e.target.matches('input, select, textarea');
  if (mod && !inField && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (mod && !inField && (e.key === 'y' || ((e.key === 'z' || e.key === 'Z') && e.shiftKey))) { e.preventDefault(); redo(); }
}, true);

/* ---------- sidebar & footer ---------- */
$('#newMeeting').onclick = () => createContainer('meeting');
$('#newDoc').onclick = () => createContainer('document');
$('#filter').addEventListener('input', renderSidebar);
$('#themeBtn').onclick = () => { const order = [null, 'light', 'dark']; S.ui.theme = order[(order.indexOf(S.ui.theme || null) + 1) % 3]; save(); applyTheme(); };

function exportData() {
  const data = JSON.stringify({ app: 'ecco-pim', version: 1, exportedAt: new Date().toISOString(), containers: S.containers, bullets: S.bullets }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = 'pim-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  S.ui.lastExport = new Date().toISOString(); save(); renderBanner();
}
$('#exportBtn').onclick = exportData;
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o.containers !== 'object' || typeof o.bullets !== 'object') throw new Error('Not a backup file');
      const n = Object.keys(o.containers).length, m = Object.keys(o.bullets).length;
      if (!confirm('Replace everything here with this backup (' + n + ' meetings/documents, ' + m + ' bullets)?\n(Ctrl+Z undoes this.)')) return;
      snap(); S.containers = o.containers; S.bullets = o.bullets; S.ui.current = null; save(); renderAll();
    } catch (err) { alert('Could not import: ' + err.message); }
    e.target.value = '';
  };
  r.readAsText(f);
};

/* ---------- start ---------- */
(function startupCleanup() {
  for (const c of Object.values(S.containers)) {
    if (c.type !== 'meeting') continue;
    for (const s of sessionsOf(c.id)) if (!(c.id === S.ui.current && s.date === todayISO()) && treeEmpty(s.id)) deleteTree(s.id);
  }
})();
if (S.ui.current && S.containers[S.ui.current]) openContainer(S.ui.current); else { S.ui.current = null; renderAll(); }
setStatus('Saved in this browser');
})();
</script>
</body>
