<style>
/* Parchment palette. Color carries meaning, and the same color means the same thing everywhere:
   green = people, amber = projects, indigo = meetings and their dated sessions, blue = links and actions,
   red = errors. Text colors keep at least 4.5:1 contrast on their background. */
:root{
  --bg:#fbf7ec; --panel:#f2ead8; --text:#2b2620; --muted:#6b6152; --faint:#b3a78f;
  --line:#e2d7bf; --accent:#2c5aa8; --accent-bg:#e2e8f2; --hover:#efe6d1;
  --done:#958a76; --warn-bg:#f6e3b8; --warn:#5f4500; --session:#4a3c8c; --session-bg:#ebe5f0;
  --pill:#ebe1cb; --err:#b3261e; --doc:#6b6152;
  --per:#1c6847; --per-bg:#dcecdc; --prj:#8a4300; --prj-bg:#f6dfbf;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e1c18; --panel:#26231e; --text:#ece6d8; --muted:#a69d8c; --faint:#5f584c;
    --line:#38332b; --accent:#8fb0ff; --accent-bg:#27324a; --hover:#2e2a23;
    --done:#7f7768; --warn-bg:#3b3120; --warn:#e8c56a; --session:#bcadff; --session-bg:#2b2740;
    --pill:#322d25; --err:#ff8a80; --doc:#a69d8c;
    --per:#86d3b0; --per-bg:#1f3a2f; --prj:#f0b46a; --prj-bg:#3d2e1a;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1c18; --panel:#26231e; --text:#ece6d8; --muted:#a69d8c; --faint:#5f584c;
  --line:#38332b; --accent:#8fb0ff; --accent-bg:#27324a; --hover:#2e2a23;
  --done:#7f7768; --warn-bg:#3b3120; --warn:#e8c56a; --session:#bcadff; --session-bg:#2b2740;
  --pill:#322d25; --err:#ff8a80; --doc:#a69d8c;
  --per:#86d3b0; --per-bg:#1f3a2f; --prj:#f0b46a; --prj-bg:#3d2e1a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 6px}

/* Sidebar */
#side{width:250px;min-width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
#side .top{padding:12px 12px 6px;display:flex;align-items:center;gap:6px}
#side .brand{font-weight:700;letter-spacing:.2px;flex:1;border:none;padding:0;background:none;text-align:left;cursor:pointer}
#side .brand:hover{background:none;color:var(--accent)}
#side .new{display:flex;gap:6px;padding:0 12px 8px}
#side .new button{flex:1}
#filter{margin:0 12px 8px;width:calc(100% - 24px)}
#lists{flex:1;overflow:auto;padding-bottom:8px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 14px 3px;font-weight:600}
.item{display:flex;gap:6px;align-items:baseline;padding:2px 14px;cursor:pointer;white-space:nowrap;overflow:hidden}
.item:hover{background:var(--hover)}
.item.cur{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
/* a small colored dot says what kind of thing each sidebar entry is */
.item .t::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--dot,transparent)}
.item.k-person{--dot:var(--per)} .item.k-project{--dot:var(--prj)} .item.k-meeting{--dot:var(--session)} .item.k-document{--dot:var(--doc)}
.item .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:11px;color:var(--muted)}
.empty-note{color:var(--muted);font-size:12px;padding:2px 14px}
.fsec{display:flex;align-items:center}
.fsec span{flex:1}
.fsec .add{border:none;padding:0 6px;font-size:15px;line-height:1;color:var(--muted)}
.fsec .add:hover{color:var(--text)}
.item.folder{padding-right:10px}

<body>
<aside id="side">

    <button id="reloadBtn" title="Reload the page, e.g. after uploading a new version">↻ Refresh</button>

<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function(){
'use strict';

/* ---------- utilities ---------- */
const KEY = 'eccopim.v1';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = (s, opt) => s ? parseISO(s).toLocaleDateString(undefined, opt || { month: 'short', day: 'numeric' }) : '';
const fmtLong = s => fmt(s, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = t => esc(t || '').replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const $ = s => document.querySelector(s);
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
function hash(str) { // cyrb53: short fingerprint of a record, to notice what changed
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

/* ---------- state ---------- */
function blank() { return { version: 2, containers: {}, bullets: {}, folders: {}, ui: { current: null, folder: null, lastExport: null, theme: null } }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.containers && o.bullets) { o.ui = o.ui || {}; return o; } }
  } catch (e) { /* storage unavailable */ }
  return null;
}
const LOADED = load();
let S = LOADED || blank();
function ensureModel() {
  if (!S.folders) S.folders = {};
  if (!S.folders.me) S.folders.me = { id: 'me', kind: 'person', name: 'Me', parentId: null, order: -1, collapsed: false };
  for (const c of Object.values(S.containers)) if (!c.links) c.links = [];
  for (const b of Object.values(S.bullets)) if (!b.links) b.links = [];
}
ensureModel();
// block selection: ids of selected bullets (visible rows), plus the anchor and moving end of the range
let bsel = new Set(), selAnchor = null, selFocus = null;

let saveTimer = null;
function setStatus(msg, err) { const s = $('#status'); s.textContent = msg; s.classList.toggle('err', !!err); }
function save() {
  setStatus('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { setStatus('Save failed. Export a backup now.', true); return; }
    if (stamp()) scheduleSync(3000);
    showSync();
  }, 250);
}
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); stamp(); } catch (e) {} });

/* ---------- undo / redo ---------- */
let undoStack = [], redoStack = [], typingSnap = false, typingTimer = null;
const snapshot = () => JSON.stringify({ c: S.containers, b: S.bullets, f: S.folders });
function snap() { undoStack.push(snapshot()); if (undoStack.length > 150) undoStack.shift(); redoStack.length = 0; typingSnap = false; }
function restoreFrom(str) {
  const o = JSON.parse(str); S.containers = o.c; S.bullets = o.b; if (o.f) S.folders = o.f; ensureModel();
  if (S.ui.current && !S.containers[S.ui.current]) S.ui.current = null;
  if (S.ui.folder && !S.folders[S.ui.folder]) S.ui.folder = null;
  bsel.clear(); selAnchor = selFocus = null; hideToast();
  save(); renderAll();
}
function undo() { if (!undoStack.length) return; const f = focusInfo(); redoStack.push(snapshot()); restoreFrom(undoStack.pop()); refocus(f); }
function redo() { if (!redoStack.length) return; const f = focusInfo(); undoStack.push(snapshot()); restoreFrom(redoStack.pop()); refocus(f); }

let toastTimer = null;
function toast(msg, canUndo) {
  const t = $('#toast'); $('#toastMsg').textContent = msg;
  $('#toastUndo').style.display = canUndo === false ? 'none' : '';
  t.style.display = 'flex';
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 8000);
}
function hideToast() { const t = $('#toast'); if (t) t.style.display = 'none'; }

/* ---------- sync: Google Drive app folder ----------
   Each browser writes only its own file (eccopim-dev-<device>.json) holding every record with its
   last-modified time; it reads the other browsers' files and keeps the newer version of each record.
   No browser ever overwrites another's file, so two laptops can't erase each other's edits. When the
   same record changed in both places since they last agreed, the newer edit wins and the other text
   goes to the Conflicts list. Deletions travel as tombstones. */
const CLIENT_ID = '893079433077-hnqv9138rg6ioje7r7qiicu5e0sf5it5.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const META_KEY = 'eccopim.meta', SYNC_KEY = 'eccopim.sync', DEV_KEY = 'eccopim.device', CONF_KEY = 'eccopim.conflicts', TOKEN_KEY = 'eccopim.token';
const COLL = { b: 'bullets', c: 'containers', f: 'folders' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
let M = lsGet(META_KEY, null), SY = lsGet(SYNC_KEY, null), CONF = lsGet(CONF_KEY, []), DEV = lsGet(DEV_KEY, null);
if (!M || !SY || !DEV || !LOADED) {
  // New or reset browser: what's here counts as older than Drive, and the browser gets a fresh identity,
  // so a file it wrote before a reset is read back like another laptop's instead of being overwritten.
  DEV = uid(); M = {};
  for (const [p, coll] of Object.entries(COLL)) for (const [id, v] of Object.entries(S[coll])) M[p + ':' + id] = { mt: 1, h: hash(JSON.stringify(v)) };
  SY = { base: {}, seen: {}, fileId: null, last: null, connected: !!(SY && SY.connected) };
  lsSet(DEV_KEY, DEV); lsSet(META_KEY, M); lsSet(SYNC_KEY, SY);
}
const saveSY = () => lsSet(SYNC_KEY, SY);

// Give every record that changed since the last call a new modified time; deleted ones become tombstones.
function stamp() {
  const now = Date.now(), live = new Set(); let n = 0;
  for (const [p, coll] of Object.entries(COLL)) for (const [id, v] of Object.entries(S[coll])) {
    const k = p + ':' + id, h = hash(JSON.stringify(v)), m = M[k]; live.add(k);
    if (!m || m.del || m.h !== h) { M[k] = { mt: now, dev: DEV, h }; n++; }
  }
  for (const k of Object.keys(M)) if (!live.has(k) && !M[k].del) { M[k] = { mt: now, dev: DEV, del: true }; n++; }
  if (n) lsSet(META_KEY, M);
  return n;
}
const dirtyKeys = () => Object.keys(M).filter(k => M[k].mt > (SY.base[k] || 0));

let token = null, tokenExp = 0, tokenClient = null;
try { const t = JSON.parse(sessionStorage.getItem(TOKEN_KEY)); if (t && t.exp > Date.now() + 60000) { token = t.token; tokenExp = t.exp; } } catch (e) {}
function dropToken() { token = null; tokenExp = 0; try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
let syncState = token ? 'ok' : (SY.connected ? 'auth' : 'off'), syncErr = '', syncing = false, syncAgain = false, syncTimer = null;

function connect() {
  const g = window.google && google.accounts && google.accounts.oauth2;
  if (!g) { syncState = 'error'; syncErr = 'Google sign-in did not load. Check the connection and reload'; showSync(); return; }
  if (!tokenClient) tokenClient = g.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,

/* Merge a meeting or document into another one: every note moves (never copied). Into a meeting, each
   dated session joins the target's session for the same date (created if needed), keeping its topic.
   Into a document, each session becomes a plain heading bullet ("Thu, Oct 29, 2026 — topic") over its notes.
   Attendees are added to the target; the target keeps its own project unless it has none. Then the source
   is deleted. */
function mergeContainer(cid, into) {
  const c = S.containers[cid], d = S.containers[into];
  if (!c || !d || cid === into || c.type === 'inbox' || d.type === 'inbox') return;
  snap();
  let n = 0;
  for (const t of childList(null, cid)) {
    if (t.isSession && treeEmpty(t.id)) { deleteTree(t.id); continue; }
    if (t.isSession && d.type === 'meeting') {
      const s = sessionFor(into, t.date);
      if ((t.text || '').trim() && !(s.text || '').trim()) s.text = t.text;
      for (const k of childList(t.id, cid)) { k.order = orderLast(s.id, into); k.parentId = s.id; setContainerDeep(k, into); n += countTree(k.id); }
      delete S.bullets[t.id];
    } else if (t.isSession) {
      t.text = fmtLong(t.date) + ((t.text || '').trim() ? ' — ' + t.text.trim() : '');
      t.isSession = false; t.date = null; t.collapsed = false;
      t.order = orderLast(null, into); t.parentId = null; setContainerDeep(t, into); n += countTree(t.id) - 1;
    } else {
      const parent = d.type === 'meeting' ? sessionFor(into, effDate(t) || todayISO()).id : null;
      t.order = orderLast(parent, into); t.parentId = parent; setContainerDeep(t, into); n += countTree(t.id);
    }
  }
  for (const b of Object.values(S.bullets)) if (b.containerId === cid) delete S.bullets[b.id]; // strays only
  for (const l of liveLinks(c)) {
    const kind = S.folders[l.folder].kind;
    if (kind === 'person' && !d.links.some(x => x.folder === l.folder)) d.links.push({ folder: l.folder, role: 'secondary' });
    if (kind === 'project' && !containerProject(d)) { addLink(d, l.folder); setRole(d, l.folder, 'primary'); }
  }
  setChain(c, 'prev', null); setChain(c, 'next', null);
  delete S.containers[cid];
  if (S.ui.current === cid) S.ui.current = null;
  openContainer(into);
  toast('Merged ' + (c.title || 'Untitled') + ' into ' + (d.title || 'Untitled') + ' (' + plural(n, 'note') + ')');
}
function mergeContainerPop(cid, x, y) {
  const c = S.containers[cid]; if (!c) return;
  popFor = null;
  const opts = moveOptions(cid), any = Object.values(S.containers).some(o => o.id !== cid && (o.type === 'meeting' || o.type === 'document'));
  pop.innerHTML = '<div style="font-weight:600;margin-bottom:4px">Merge ' + esc(c.title || 'Untitled') + ' into…</div>' +
    '<div class="note">All its notes move to the meeting or document you pick, under their original dates. Then this ' + c.type + ' is deleted. Nothing is copied or lost.</div>' +
    (any ? '<label>Into <select id="mInto"><option value="">choose…</option>' + opts + '</select></label>'
         : '<div class="note" style="margin-top:6px">There is no other meeting or document yet.</div>') +
    '<div class="btns"><button id="mCancel">Cancel</button><button id="mGo" class="primary" disabled>Merge</button></div>';
  placePop(x, y);
  const sel = $('#mInto');
  if (sel) sel.onchange = () => { $('#mGo').disabled = !sel.value; };
  $('#mCancel').onclick = closePop;
  $('#mGo').onclick = () => { const v = sel && sel.value; if (!v) return; closePop(); mergeContainer(cid, v); };
}

/* ---------- containers ---------- */
function createContainer(type) {

}
function cleanupEmptySession(cid) {
  const c = S.containers[cid]; if (!c || c.type !== 'meeting') return;
  for (const s of sessionsOf(cid)) if (s.date === todayISO() && treeEmpty(s.id)) deleteTree(s.id);
}
function openContainer(id, focusTitle) {
  if (S.ui.current && S.ui.current !== id) cleanupEmptySession(S.ui.current);
  bsel.clear(); selAnchor = selFocus = null;
  S.ui.current = id; S.ui.folder = null;

  if (c.type === 'meeting') {
    const today = todayISO();
    let s = sessionsOf(id).find(x => x.date === today);

      s = newBullet(id, null, orderFirst(null, id), { isSession: true, date: today });
    }
    s.collapsed = false;

    focusId = k[k.length - 1].id;
  } else {
    let k = childList(null, id);

}
function setChain(a, field, bId) {
  const other = field === 'prev' ? 'next' : 'prev';
  const old = a[field];
  if (old && S.containers[old] && S.containers[old][other] === a.id) S.containers[old][other] = null;
  a[field] = bId || null;
  if (bId) {
    const B = S.containers[bId];

    B[other] = a.id;

function deleteContainer(c) {

  snap();

  setChain(c, 'prev', null); setChain(c, 'next', null);

}

/* ---------- focus & caret ---------- */
function getCaret(node) {
  const s = getSelection(); if (!s.rangeCount) return 0;
  const r = s.getRangeAt(0); if (!node.contains(r.startContainer)) return 0;
  const pre = r.cloneRange(); pre.selectNodeContents(node); pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length;
}
function setCaret(node, pos) {
  const len = node.textContent.length;
  if (pos === 'end' || pos > len) pos = len;
  const r = document.createRange();
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  let n, left = pos, placed = false;
  while ((n = walker.nextNode())) { if (left <= n.length) { r.setStart(n, left); placed = true; break; } left -= n.length; }
  if (!placed) { r.selectNodeContents(node); r.collapse(false); } else r.collapse(true);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function focusInfo() {
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains('tx')) { const n = a.closest('.node'); return { id: n.dataset.id, pos: getCaret(a) }; }
  return null;
}
function txOf(id) { const n = document.querySelector('.node[data-id="' + id + '"]'); return n ? n.querySelector(':scope > .row > .tx') : null; }
function refocus(f) {
  if (!f) return;
  const t = txOf(f.id); if (!t) return;
  t.focus(); setCaret(t, f.pos);
  t.scrollIntoView({ block: 'nearest' });
}
function caretAtEdge(node, up) {
  const s = getSelection(); if (!s.rangeCount) return true;
  const r = s.getRangeAt(0).cloneRange(); r.collapse(true);
  const rect = r.getClientRects()[0]; if (!rect) return true;
  const er = node.getBoundingClientRect();
  const lh = parseFloat(getComputedStyle(node).lineHeight) || 22;
  return up ? rect.top - er.top < lh * 0.8 : er.bottom - rect.bottom < lh * 0.8;
}
function commit(focusId, pos) { save(); renderSidebar(); renderMain(); refocus({ id: focusId, pos }); }

const viewOpen = {}; // which collapsible view sections are expanded (per session)
function srcLabel(b) {

}
function goToSource(b) {

function renderFolder(ct, f) {

  const open = roots.filter(r => !r.b.done);

  const notes = open.filter(isNote).sort((a, b) => (effDate(b.b) || '').localeCompare(effDate(a.b) || '') || a.b.containerId.localeCompare(b.b.containerId) || a.b.order - b.b.order);

  }

  if (sec.length && header('sec', 'Also involves ' + (f.id === 'me' ? 'me' : (f.name || 'this')), sec.length, true, true)) items(sec, true);
  if (header('mtg', 'Meetings & documents', linked.length, true, false)) {

/* Shared pieces of the gathered views (person/project, Today, Search): a section header that can

function vHeader(ct, key, label, n, collapsible, defOpen, cls) {
  const isOpen = collapsible ? (viewOpen[key] !== undefined ? viewOpen[key] : defOpen) : true;
  const h = el('div', 'vsec' + (collapsible ? ' tog' : '') + (cls ? ' ' + cls : ''));
  h.textContent = (collapsible ? (isOpen ? '▾ ' : '▸ ') : '') + label + ' ';
  if (n != null) { const c = el('span', 'n'); c.textContent = '(' + n + ')'; h.appendChild(c); }
  if (collapsible) h.onclick = () => { viewOpen[key] = !isOpen; renderMain(); };
  ct.appendChild(h);
  return isOpen;
}
function vItems(ct, list, dim, flat) {
  const g = el('div', 'outline vgroup' + (dim ? ' dim' : ''));
  const idxCache = new Map(), idxOf = cid => { if (!idxCache.has(cid)) idxCache.set(cid, kidsIndex(cid)); return idxCache.get(cid); };
  let lastSrc = null;
  for (const r of list) {
    const lab = srcLabel(r.b);
    if (lab !== lastSrc) {
      const s = el('div', 'src'); s.textContent = lab + (r.inherited ? ' · via project' : '');
      s.title = 'Open where this was written'; s.onclick = () => goToSource(r.b); g.appendChild(s); lastSrc = lab;
    }
    const n = nodeEl(r.b, idxOf(r.b.containerId), flat); n.dataset.root = '1'; g.appendChild(n);
  }
  ct.appendChild(g);
  return g;
}
function vEmpty(ct, text) { const e = el('div', 'vempty'); e.textContent = text; ct.appendChild(e); }

/* ---------- views: Today (any day), Calendar, Search ---------- */
function goView(view, opts) {
  if (S.ui.current) cleanupEmptySession(S.ui.current);
  bsel.clear(); selAnchor = selFocus = null;
  S.ui.current = null; S.ui.folder = null; S.ui.view = view;
  Object.assign(S.ui, opts || {});
  save(); renderAll(); $('#main').scrollTop = 0;
}
const curView = () => (S.ui.current || S.ui.folder) ? null : (S.ui.view || 'today');
function todayCount() { // overdue + active today, for the sidebar badge
  const t = todayISO(); let n = 0, late = 0;
  for (const b of Object.values(S.bullets)) {
    if (b.isSession || b.done || (!b.start && !b.end) || !S.containers[b.containerId] || !(b.text || '').trim()) continue;
    if (isLate(b)) { n++; late++; } else if (onDay(b, t)) n++;
  }
  return { n, late };
}
function dayLog(d) { // meetings, documents and folders where something was written on day d
  const out = new Map(), get = cid => { if (!out.has(cid)) out.set(cid, { c: S.containers[cid], sess: [], n: 0 }); return out.get(cid); };
  for (const b of Object.values(S.bullets)) {
    if (!S.containers[b.containerId]) continue;
    if (b.isSession) { if (b.date === d && !treeEmpty(b.id)) get(b.containerId).sess.push(b); continue; }
    if (!(b.text || '').trim()) continue;
    const m = M['b:' + b.id];
    if ((b.created && dayOf(b.created) === d) || (m && m.mt > 1 && !m.del && dayOf(m.mt) === d)) get(b.containerId).n++;
  }
  return [...out.values()].sort((a, b) => (b.sess.length - a.sess.length) || (a.c.title || '').localeCompare(b.c.title || ''));
}
function logRow(box, x, d) {
  const c = x.c, r = el('div', 'vlink');
  const k = el('span', 'k ' + c.type), t = el('span', 't'), dd = el('span', 'd');
  t.textContent = c.type === 'inbox' ? 'Added under ' + folderName(c.folderId) : (c.title || 'Untitled');
  const topic = x.sess.map(s => (s.text || '').trim()).filter(Boolean).join(', ');
  dd.textContent = [c.type === 'meeting' ? 'Meeting' + (x.sess.length ? ' · session' + (topic ? ': ' + topic : '') : '') : c.type === 'document' ? 'Document' : 'Person or project',
    x.n ? plural(x.n, 'note') + ' written or edited' : ''].filter(Boolean).join(' · ');
  r.append(k, t, dd);
  r.title = 'Open';
  r.onclick = () => {
    if (c.type === 'inbox') { openFolder(c.folderId); return; }
    openContainer(c.id);
    if (x.sess.length && d !== todayISO()) { const s = x.sess[0]; s.collapsed = false; reveal(s.id); }

}
function renderDay(ct) {
  const today = todayISO(), d = S.ui.day && S.ui.day !== today ? S.ui.day : today, isToday = d === today;
  const head = el('div', 'head');
  const tt = el('div', 'dtitle'); tt.textContent = isToday ? 'Today' : parseISO(d).toLocaleDateString(undefined, { weekday: 'long' });
  head.appendChild(tt);
  const sub = el('div', 'sub');
  const ds = el('span'); ds.textContent = parseISO(d).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const nav = el('span', 'dnav');
  const mk = (txt, title, fn) => { const b = el('button'); b.textContent = txt; b.title = title; b.onclick = fn; return b; };
  nav.append(mk('‹', 'Previous day', () => goView('today', { day: addDays(d, -1) })));
  if (!isToday) nav.append(mk('Today', 'Back to today', () => goView('today', { day: null })));
  nav.append(mk('›', 'Next day', () => goView('today', { day: addDays(d, 1) })));
  const cal = el('button', 'go'); cal.textContent = 'Month view'; cal.onclick = () => goView('calendar', { month: d.slice(0, 7) });
  sub.append(ds, nav, cal);
  head.appendChild(sub); ct.appendChild(head);

  const all = liveItems(), dated = all.filter(b => b.start || b.end);
  const k = 'day:';
  if (isToday) {
    const late = (dated.filter(isLate).map(b => ({ b }))).sort((a, b) => a.b.end.localeCompare(b.b.end));
    const now = (dated.filter(b => !b.done && !isLate(b) && onDay(b, d)).map(b => ({ b }))).sort((a, b) => spanOf(a.b).e.localeCompare(spanOf(b.b).e));
    const end7 = addDays(d, 7);
    const soon = (dated.filter(b => !b.done && spanOf(b).s > d && spanOf(b).s <= end7).map(b => ({ b }))).sort((a, b) => spanOf(a.b).s.localeCompare(spanOf(b.b).s));
    if (late.length) { vHeader(ct, k + 'late', 'Overdue', late.length, false, true, 'late'); vItems(ct, late, false, true); }
    vHeader(ct, k + 'now', 'Active today', now.length, false);
    if (now.length) vItems(ct, now, false, true);
    else vEmpty(ct, 'Nothing scheduled for today. An item shows here while today falls between its start and end dates, or on its due date. Right-click a bullet to give it dates.');
    if (soon.length && vHeader(ct, k + 'soon', 'Next 7 days', soon.length, true, true)) vItems(ct, soon, false, true);
  } else {
    const on = (dated.filter(b => onDay(b, d) && !(spanOf(b).e === '9999-12-31' && spanOf(b).s < d)).map(b => ({ b })))
      .sort((a, b) => (a.b.done - b.b.done) || spanOf(a.b).s.localeCompare(spanOf(b.b).s));

    const box = el('div', 'outline');
    if (!log.length) { const e = el('div', 'vempty'); e.textContent = 'No sessions or notes from this day.'; box.appendChild(e); }

  if (done.length && vHeader(ct, k + 'done', 'Completed', done.length, true, !isToday)) vItems(ct, done, false, true);
  if (isToday) {
    const n = openCount('me'), r = el('div', 'vlink'); r.style.marginTop = '14px';
    const kk = el('span', 'k inbox'), t = el('span', 't'), dd = el('span', 'd');
    t.textContent = 'Me (To-Do)'; dd.textContent = n ? plural(n, 'open item') + ', dated or not' : 'nothing open';
    r.append(kk, t, dd); r.onclick = () => openFolder('me'); ct.appendChild(r);
  }
  if (!Object.values(S.containers).some(c => c.type !== 'inbox')) ct.appendChild(welcome());
}

function renderCalendar(ct) {
  const today = todayISO(), mon = /^\d{4}-\d{2}$/.test(S.ui.month || '') ? S.ui.month : today.slice(0, 7);
  const first = parseISO(mon + '-01'), y = first.getFullYear(), m = first.getMonth();
  const head = el('div', 'head');
  const tt = el('div', 'dtitle'); tt.textContent = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  head.appendChild(tt);
  const sub = el('div', 'sub');
  const shift = n => isoOf(new Date(y, m + n, 1)).slice(0, 7);
  const nav = el('span', 'dnav');
  const mk = (txt, title, fn) => { const b = el('button'); b.textContent = txt; b.title = title; b.onclick = fn; return b; };
  nav.append(mk('‹', 'Previous month', () => goView('calendar', { month: shift(-1) })));
  if (mon !== today.slice(0, 7)) nav.append(mk('This month', 'Back to this month', () => goView('calendar', { month: null })));
  nav.append(mk('›', 'Next month', () => goView('calendar', { month: shift(1) })));
  const key = el('span'); key.textContent = 'Meeting sessions in purple · open items on their start, end or due date · checked items are hidden · click a day for all of it, including what was completed';
  sub.append(nav, key); head.appendChild(sub); ct.appendChild(head);

  const start = new Date(y, m, 1 - first.getDay()), days = [];
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(isoOf(d)); }
  while (days.length > 35 && days[days.length - 7].slice(0, 7) !== mon) days.splice(days.length - 7, 7);
  const lo = days[0], hi = days[days.length - 1], ev = {};
  const put = (d, e) => { if (d >= lo && d <= hi) (ev[d] = ev[d] || []).push(e); };
  for (const b of Object.values(S.bullets)) {
    const c = S.containers[b.containerId]; if (!c) continue;
    if (b.isSession) { if (!treeEmpty(b.id)) put(b.date, { k: 's', o: 0, b, text: (c.title || 'Untitled') + ((b.text || '').trim() ? ' · ' + b.text.trim() : '') }); continue; }
    if (!(b.text || '').trim() || b.done) continue; // checked items leave the calendar (the day view still lists them)
    if (b.start || b.end) {
      const late = isLate(b);
      if (b.start && b.end && b.start !== b.end) { put(b.start, { k: 'i', o: 1, b, pre: '▸ ', tip: 'Starts', late }); put(b.end, { k: 'i', o: 1, b, pre: '◂ ', tip: 'Ends', late }); }
      else if (b.start && !b.end) put(b.start, { k: 'i', o: 1, b, pre: '▸ ', tip: 'From', late });
      else put(b.end || b.start, { k: 'i', o: 1, b, pre: '• ', tip: 'Due', late });
    }
  }
  const grid = el('div', 'cal');
  for (let i = 0; i < 7; i++) { const w = el('div', 'wd'); w.textContent = parseISO(days[i]).toLocaleDateString(undefined, { weekday: 'short' }); grid.appendChild(w); }
  const MAX = 4;
  for (const d of days) {
    const cell = el('div', 'cell' + (d.slice(0, 7) !== mon ? ' out' : '') + (d === today ? ' today' : ''));
    cell.title = 'Open ' + fmtLong(d);
    const dn = el('span', 'dn'); dn.textContent = parseISO(d).getDate(); cell.appendChild(dn);
    const list = (ev[d] || []).sort((a, b) => a.o - b.o || (a.b.done - b.b.done));
    for (const e of list.slice(0, list.length > MAX + 1 ? MAX : MAX + 1)) {
      const x = el('div', 'ev ' + e.k + (e.late && e.k === 'i' ? ' late' : '') + (e.k === 'i' && e.b.done ? ' d' : ''));
      x.textContent = (e.pre || '') + (e.text || e.b.text);
      x.title = (e.tip ? e.tip + ': ' : '') + (e.text || e.b.text) + (e.k === 's' ? '' : '\n' + srcLabel(e.b)) + (e.late ? '\nOverdue' : '');
      x.onclick = ev2 => {
        ev2.stopPropagation();
        if (e.k === 's') { openContainer(e.b.containerId); e.b.collapsed = false; reveal(e.b.id); }
        else goToSource(e.b);
      };
      cell.appendChild(x);
    }
    if (list.length > MAX + 1) { const mo = el('div', 'more'); mo.textContent = '+' + (list.length - MAX) + ' more'; cell.appendChild(mo); }
    cell.onclick = () => goView('today', { day: d === today ? null : d });
    grid.appendChild(cell);
  }
  ct.appendChild(grid);
}

/* Search: every word must appear in the item's text, its people/project names, or where it was written
   (meeting/document title, session topic), and at least one word in the item itself. Done items included. */
let searchTimer = null, searchAll = false;
function searchWords(q) { return q.toLowerCase().split(/\s+/).filter(Boolean); }

    const msg = 'This looks like an email thread with ' + dated.length + ' dated note' + (dated.length > 1 ? 's' : '') +
      (range.length ? ' (' + fmt(range[0]) + (range.length > 1 ? ' to ' + fmt(range[range.length - 1]) : '') + ')' : '') +

content.addEventListener('keydown', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('tx')) return;
  const b = bulletOf(t); const cid = b.containerId;
  const mod = e.ctrlKey || e.metaKey;
  const isRoot = !!t.closest('.node').dataset.root; // a top item in a person/project view
  const inheritLinks = nb => { if (isRoot && nb.parentId === b.parentId) nb.links = liveLinks(b).map(l => ({ folder: l.folder, role: l.role })); };

  if (e.key === 'Enter' && mod) {
    e.preventDefault(); if (b.isSession) return;
    snap(); b.done = !b.done; b.doneAt = b.done ? new Date().toISOString() : null;
    commit(b.id, getCaret(t)); return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (t.closest('.node').dataset.flat) { toast('Add notes in the meeting or document itself: click the grey line above this item', false); return; }
    const pos = getCaret(t), text = t.textContent;
    snap();
    if (b.isSession) { b.collapsed = false; const nb = newBullet(cid, b.id, orderFirst(b.id, cid)); commit(nb.id, 0); return; }
    if (pos === 0 && text.length > 0) {
      const s = siblings(b), p = s[s.indexOf(b) - 1];
      inheritLinks(newBullet(cid, b.parentId, p ? (p.order + b.order) / 2 : b.order - 1));
      commit(b.id, 0); return;
    }
    b.text = text.slice(0, pos);
    const after = text.slice(pos);
    const kids = childList(b.id, cid);
    const nb = (kids.length && !b.collapsed && !t.closest('.node').dataset.flat)
      ? newBullet(cid, b.id, orderFirst(b.id, cid), { text: after })
      : newBullet(cid, b.parentId, orderAfter(b), { text: after });
    inheritLinks(nb);
    commit(nb.id, 0); return;
  }
  if (e.key === 'Backspace' && !mod) {
    const ts = getSelection();
    if (!ts.isCollapsed || getCaret(t) !== 0 || b.isSession) return;
    if (isRoot) { // never merge across items from different notes
      if (t.textContent || childList(b.id, cid).length) return;
      e.preventDefault(); snap();
      const list = [...content.querySelectorAll('.outline .tx')]; const pv = list[list.indexOf(t) - 1];
      deleteTree(b.id); save(); renderMain(); if (pv) { const id = pv.closest('.node').dataset.id; refocus({ id, pos: 'end' }); }
      return;
    }
    const list = [...content.querySelectorAll('.outline .tx')];
    const prevTx = list[list.indexOf(t) - 1];
    const hasKids = childList(b.id, cid).length > 0;
    if (!prevTx || hasKids) return;
    const prev = bulletOf(prevTx);
    e.preventDefault(); snap();
    if (!t.textContent) { deleteTree(b.id); commit(prev.id, 'end'); return; }
    if (prev.isSession) return;
    const at = prev.text.length; prev.text += t.textContent; deleteTree(b.id); commit(prev.id, at); return;
  }

    if (isRoot) {
      if (e.shiftKey) { toast('Already at the top level', false); return; }
      // in a person/project view, nest under the item shown just above when both were written in the same place
      const roots = S.ui.folder ? [...content.querySelectorAll('.vgroup > .node[data-root]')] : [];
      const i = roots.indexOf(t.closest('.node')), above = i > 0 ? S.bullets[roots[i - 1].dataset.id] : null;
      if (above && above.containerId === cid) {
        snap(); const pos = getCaret(t);
        b.order = orderLast(above.id, cid); b.parentId = above.id; above.collapsed = false;
        commit(b.id, pos); return;
      }
      toast(above ? 'The item above was written somewhere else (' + srcLabel(above) + '). Drag this item\'s dot onto it to nest it there; that moves it there.'
                  : 'To indent, open the note where it was written (click the grey line above it).', false);
      return;
    }
    const pos = getCaret(t);
    if (e.shiftKey) {
      if (!b.parentId) return;
      const parent = S.bullets[b.parentId]; if (parent.isSession) { toast('Already at the top level under this date', false); return; }
      snap(); const ord = orderAfter(parent); b.parentId = parent.parentId; b.order = ord;
    } else {
      const s = siblings(b), p = s[s.indexOf(b) - 1]; if (!p) { toast('Nothing above it to indent under: it is the first bullet ' + (b.parentId ? 'at this level' : 'here'), false); return; }
      snap(); b.order = orderLast(p.id, cid); b.parentId = p.id; p.collapsed = false;
    }
    commit(b.id, pos); return;
  }
  if (mod && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault(); if (b.isSession || isRoot) return;
    const s = siblings(b), i = s.indexOf(b), o = s[e.key === 'ArrowUp' ? i - 1 : i + 1];

  }
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !e.shiftKey && !e.altKey) {
    const up = e.key === 'ArrowUp';

    const list = [...content.querySelectorAll('.outline .tx')];

    if (drag.type === 'bullet') { const ids = drag.ids; drag = null; linkItems(ids, fid); refocus(f); return; }
    if (drag.type === 'container' && S.containers[drag.id].type === 'meeting') { const cid = drag.id; drag = null; linkMeeting(cid, fid); refocus(f); return; }
    if (drag.type === 'container') { const c = S.containers[drag.id]; snap(); if (!addLink(c, fid)) setStatus(folderName(fid) + ' is already linked'); }
    else if (drag.type === 'folder') { snap(); S.folders[drag.id].parentId = fid; S.folders[fid].collapsed = false; }
    save(); renderAll(); refocus(f); flashFolder(fid);
  } else if (ci && drag.type === 'bullet' && !drag.ids.some(id => S.bullets[id] && S.bullets[id].isSession)) { const ids = drag.ids; drag = null; moveToContainer(ids, ci.dataset.cid); return; }
  else if (hdr && drag.type === 'folder') { snap(); S.folders[drag.id].parentId = null; save(); renderAll(); refocus(f); }
  drag = null;
});
function dropZone(row, t, e) {
  if (t.isSession) return 'child';
  if (S.ui.folder && row.closest('.node').dataset.root) return 'child'; // gathered views are sorted by date: before/after would do nothing visible
  const r = row.getBoundingClientRect(), lower = e.clientY > r.top + r.height / 2;
  const tx = row.querySelector('.tx').getBoundingClientRect();
  if (lower && e.clientX > tx.left + 40) return 'child';
  return lower ? 'after' : 'before';
}
content.addEventListener('dragover', e => {
  if (!drag) return;
  e.preventDefault(); // never let the browser drop text into a note
  clearDropMarks(); dropAt = null; e.dataTransfer.dropEffect = 'none';
  if (drag.type !== 'bullet') return;
  const row = e.target.closest('.outline .row'); if (!row) return;
  const t = bulletOf(row);
  if (!t || drag.ids.some(id => !S.bullets[id] || S.bullets[id].isSession || isDesc(t, id))) return; // sessions only link
  const zone = dropZone(row, t, e);
  row.classList.add('drop-' + zone); dropAt = { t: t.id, zone }; e.dataTransfer.dropEffect = 'move';
});
content.addEventListener('drop', e => {
  if (!drag) return;
  e.preventDefault(); clearDropMarks();
  if (drag.type !== 'bullet' || !dropAt) { drag = null; return; }
  const ids = drag.ids.filter(id => S.bullets[id]), t = S.bullets[dropAt.t]; drag = null;
  if (!ids.length || !t) { dropAt = null; return; }
  snap();
  const cid = t.containerId, moving = new Set(ids);
  if (dropAt.zone === 'child') { t.collapsed = false; placeAt(ids, t.id, cid, 0); }
  else {
    const sib = childList(t.parentId, cid).filter(x => !moving.has(x.id));
    placeAt(ids, t.parentId, cid, sib.indexOf(t) + (dropAt.zone === 'after' ? 1 : 0));
  }
  dropAt = null;
  if (ids.length === 1) { bsel.clear(); commit(ids[0], 'end'); } else { save(); renderAll(); }
});
lists.addEventListener('contextmenu', e => {
  const fi = e.target.closest('.item.folder'); if (!fi) return;
  e.preventDefault();
  const f = S.folders[fi.dataset.fid]; popFor = null;
  pop.innerHTML = '<div style="font-weight:600;margin-bottom:4px">' + esc(folderPath(f.id)) + '</div><div class="menu">' +
    '<button id="fOpen">Open</button><button id="fRen">Rename</button><button id="fSub">New sub-folder</button>' +
    (f.parentId ? '<button id="fTop">Move to top level</button>' : '') +
    (f.id !== 'me' ? '<button id="fMerge">Merge into…</button><button id="fDel">Delete…</button>' : '') + '</div>';
  placePop(e.clientX, e.clientY);
  $('#fOpen').onclick = () => { closePop(); openFolder(f.id); };
  $('#fRen').onclick = () => { closePop(); openFolder(f.id, true); const t = $('.head .title'); if (t) t.select(); };
  $('#fSub').onclick = () => { closePop(); newFolder(f.kind, f.id); };
  if ($('#fTop')) $('#fTop').onclick = () => { snap(); f.parentId = null; save(); closePop(); renderAll(); };
  if ($('#fMerge')) $('#fMerge').onclick = () => mergePop(f.id, e.clientX, e.clientY);
  if ($('#fDel')) $('#fDel').onclick = () => { closePop(); deleteFolder(f.id); };
});

/* ---------- sidebar & footer ---------- */
$('#homeBtn').onclick = () => goView('today', { day: null }); // Home is Today
$('#reloadBtn').textContent = '↻ Refresh (' + (isMac ? '⌘R' : 'Ctrl+R') + ')';
$('#reloadBtn').onclick = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); stamp(); } catch (e) {} location.reload(); };
$('#newMeeting').onclick = () => createContainer('meeting');
$('#newDoc').onclick = () => createContainer('document');
$('#filter').addEventListener('input', renderSidebar);
$('#themeBtn').onclick = () => { const order = [null, 'light', 'dark']; S.ui.theme = order[(order.indexOf(S.ui.theme || null) + 1) % 3]; save(); applyTheme(); };
$('#toastUndo').onclick = () => { hideToast(); undo(); };

function exportData() {
  const data = JSON.stringify({ app: 'hinay', version: 2, exportedAt: new Date().toISOString(), containers: S.containers, bullets: S.bullets, folders: S.folders }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = 'pim-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  S.ui.lastExport = new Date().toISOString(); save(); renderBanner();
}
$('#exportBtn').onclick = exportData;
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o.containers !== 'object' || typeof o.bullets !== 'object') throw new Error('Not a backup file');
      const n = Object.values(o.containers).filter(c => c.type !== 'inbox').length, m = Object.keys(o.bullets).length, k = o.folders ? Object.keys(o.folders).length : 0;
      if (!confirm('Replace everything with this backup (' + n + ' meetings/documents, ' + m + ' bullets, ' + k + ' people/projects)?' + (SY.connected ? '\nThis also replaces your notes in Drive and on your other laptops.' : '') + '\n(Ctrl+Z undoes this.)')) return;
      snap(); S.containers = o.containers; S.bullets = o.bullets; S.folders = o.folders || {}; ensureModel(); S.ui.current = null; S.ui.folder = null; save(); renderAll();
    } catch (err) { alert('Could not import: ' + err.message); }
    e.target.value = '';
  };
  r.readAsText(f);
};

/* ---------- start ---------- */
(function startupCleanup() {
  for (const c of Object.values(S.containers)) {
    if (c.type !== 'meeting') continue;
    for (const s of sessionsOf(c.id)) if (!(c.id === S.ui.current && s.date === todayISO()) && treeEmpty(s.id)) deleteTree(s.id);
  }
})();
try { if (!sessionStorage.getItem('eccopim.tab')) { sessionStorage.setItem('eccopim.tab', '1'); S.ui.current = null; S.ui.folder = null; S.ui.view = 'today'; S.ui.day = null; } } catch (e) {}
if (S.ui.current && S.containers[S.ui.current]) openContainer(S.ui.current);
else { S.ui.current = null; if (S.ui.folder && !S.folders[S.ui.folder]) S.ui.folder = null; renderAll(); }
$('#syncBtn').onclick = () => { if (syncState === 'error' && token) syncNow(); else connect(); };
$('#confBtn').onclick = () => conflictsPop();
window.addEventListener('online', () => syncNow());
window.addEventListener('offline', () => { if (SY.connected) { syncState = 'offline'; showSync(); } });
// Keep a copy of the page in the browser so it opens without a network (needs sw.js next to index.html).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) syncNow(); });
setInterval(() => { if (!document.hidden && (token || syncState === 'ok')) syncNow(); }, 60000); // pick up other laptops' edits
let shownDay = todayISO(); // after midnight, Today and the badge move to the new day
setInterval(() => { if (todayISO() === shownDay) return; shownDay = todayISO(); renderSidebar(); if (curView() && curView() !== 'search' && !focusInfo()) renderMain(); }, 60000);
showSync();
if (token) syncNow();
})();
</script>
</body>
