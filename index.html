<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neoECCO</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{
  --bg:#fbfbfa; --panel:#f3f2ef; --text:#1d1d1b; --muted:#85837d; --faint:#b9b6af;
  --line:#e3e1dc; --accent:#2f6fde; --accent-bg:#e8effc; --hover:#ecebe6;
  --done:#9a978f; --warn-bg:#fff4d6; --warn:#7a5a00; --session:#5641b8; --session-bg:#f1eefc;
  --pill:#eceae4;
  --per:#1d6b4f; --per-bg:#e3f2ea; --prj:#8a4b00; --prj-bg:#fbeedb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1c1e; --panel:#222326; --text:#e6e5e1; --muted:#8f8d88; --faint:#5d5c58;
    --line:#33343a; --accent:#6b9cff; --accent-bg:#26324a; --hover:#2b2c30;
    --done:#77756f; --warn-bg:#3a3220; --warn:#e8c56a; --session:#ab9dff; --session-bg:#2a2640;
    --pill:#2e2f34;
    --per:#7fd3ae; --per-bg:#1f3a2f; --prj:#f0b46a; --prj-bg:#3d2e1a;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1c1e; --panel:#222326; --text:#e6e5e1; --muted:#8f8d88; --faint:#5d5c58;
  --line:#33343a; --accent:#6b9cff; --accent-bg:#26324a; --hover:#2b2c30;
  --done:#77756f; --warn-bg:#3a3220; --warn:#e8c56a; --session:#ab9dff; --session-bg:#2a2640;
  --pill:#2e2f34;
  --per:#7fd3ae; --per-bg:#1f3a2f; --prj:#f0b46a; --prj-bg:#3d2e1a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 6px}

/* Sidebar */
#side{width:250px;min-width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
#side .top{padding:12px 12px 6px;display:flex;align-items:center;gap:6px}
#side .brand{font-weight:700;letter-spacing:.2px;flex:1;border:none;padding:0;background:none;text-align:left;cursor:pointer}
#side .brand:hover{background:none;color:var(--accent)}
#side .new{display:flex;gap:6px;padding:0 12px 8px}
#side .new button{flex:1}
#filter{margin:0 12px 8px;width:calc(100% - 24px)}
#lists{flex:1;overflow:auto;padding-bottom:8px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 14px 3px;font-weight:600}
.item{display:flex;gap:6px;align-items:baseline;padding:2px 14px;cursor:pointer;white-space:nowrap;overflow:hidden}
.item:hover{background:var(--hover)}
.item.cur{background:var(--accent-bg)}
.item .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:11px;color:var(--muted)}
.empty-note{color:var(--muted);font-size:12px;padding:2px 14px}
.fsec{display:flex;align-items:center}
.fsec span{flex:1}
.fsec .add{border:none;padding:0 6px;font-size:15px;line-height:1;color:var(--muted)}
.fsec .add:hover{color:var(--text)}
.item.folder{padding-right:10px}
.item.folder .ftw{width:12px;flex:0 0 12px;color:var(--muted);font-size:10px;cursor:pointer}
.item .cnt{font-size:11px;color:var(--muted);background:var(--pill);border-radius:8px;padding:0 6px}
.item.drop,.fsec.drop{background:var(--accent-bg);outline:1px dashed var(--accent);outline-offset:-1px}
.item.flash{animation:flash 1.2s}
#pop .menu button{display:block;width:100%;text-align:left;border:none;padding:4px 6px}
#pop select{max-width:200px}
#pop .danger{color:#d33}
#side .foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
#status{color:var(--muted);flex:1 0 100%}
#status.err{color:#d33}
#side .foot button[hidden]{display:none}
#syncBtn.urgent{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600;animation:pulse 1.6s ease-in-out infinite}
#syncBtn.urgent:hover{opacity:.85}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,111,222,.6)}50%{box-shadow:0 0 0 6px rgba(47,111,222,0)}}
@media (prefers-reduced-motion: reduce){#syncBtn.urgent{animation:none}}
#pop .conf{max-height:50vh;overflow:auto;max-width:420px}
#pop .ci{border-top:1px solid var(--line);padding:6px 0;white-space:pre-wrap;word-break:break-word}
#pop .ci .cm{font-size:11.5px;color:var(--muted)}
#pop .ci .btns{margin-top:4px}

/* Main */
#main{flex:1;height:100%;overflow:auto;display:flex;flex-direction:column}
#banner{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:5px 24px;display:flex;gap:10px;align-items:center}
#banner[hidden]{display:none}
#content{padding:16px 28px 120px;width:100%}
.head .title{font-size:20px;font-weight:650;border:none;background:transparent;width:100%;padding:2px 0;outline:none}
.head .title::placeholder{color:var(--faint)}
.head .sub{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.head .sub select{font-size:12.5px;max-width:200px;padding:0 4px}
.head .sub .go{border:none;color:var(--accent);padding:0 3px}
.head .sub .del{margin-left:auto;font-size:12px;color:var(--muted)}

.strip{border:1px solid var(--line);border-radius:7px;margin:0 0 12px;padding:6px 10px;background:var(--panel)}
.strip .h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:2px}
.strip .oi{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.strip .oi .t{cursor:pointer;flex:1}
.strip .oi .t:hover{text-decoration:underline}
.strip .none{color:var(--muted);font-size:12.5px}

/* Outline */
.outline{max-width:1100px}
.node{position:relative}
.kids{margin-left:11px;padding-left:10px;border-left:1px solid var(--line)}
.row{display:flex;align-items:flex-start;gap:4px;min-height:22px;border-radius:4px;padding:0 4px}
.row:hover{background:var(--hover)}
.row.sel,.row.sel:hover{background:var(--accent-bg);box-shadow:inset 2px 0 0 var(--accent)}
body.sweeping,body.sweeping *{-webkit-user-select:none!important;user-select:none!important}
.tw{width:14px;flex:0 0 14px;text-align:center;color:var(--faint);font-size:11px;line-height:22px;user-select:none}
.tw.has{cursor:pointer;color:var(--muted)}
.tw.has:hover{color:var(--text)}
.ck{margin:5px 2px 0 0;opacity:0;cursor:pointer;flex:0 0 auto}
.row:hover .ck,.ck.show,.ck:focus{opacity:1}
.tx{flex:1;outline:none;min-width:40px;line-height:22px;white-space:pre-wrap;word-break:break-word}
.tx:empty:before{content:attr(data-ph);color:var(--faint)}
.tx a{color:var(--accent);text-decoration:underline;cursor:pointer}
.row.done .tx{text-decoration:line-through;color:var(--done)}
.meta{flex:0 0 auto;display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--muted);line-height:22px;white-space:nowrap}
.pill{background:var(--pill);border-radius:9px;padding:0 7px;line-height:17px}
.tag{border-radius:9px;padding:0 7px;line-height:17px;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;white-space:nowrap}
.tag.person{background:var(--per-bg);color:var(--per)}
.tag.project{background:var(--prj-bg);color:var(--prj)}
.tag.pri{font-weight:700;border-color:currentColor}
.tag .x{margin-left:5px;opacity:.55}
.tag .x:hover{opacity:1}
.tw[draggable="true"]{cursor:grab}
.row.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.row.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.row.drop-child{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.head .trow{display:flex;align-items:center}
.grip{cursor:grab;color:var(--faint);font-size:15px;padding:0 6px 0 0;user-select:none}
.grip:hover{color:var(--text)}
.head .sub .chips{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.additem{width:100%;max-width:1100px;margin:2px 0 10px;padding:5px 9px;border-radius:7px}
.vsec{display:flex;gap:6px;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin:16px 0 2px;max-width:1100px;border-bottom:1px solid var(--line);padding-bottom:2px}
.vsec.tog{cursor:pointer}
.vsec.tog:hover{color:var(--text)}
.vsec .n{font-weight:500}
.src{font-size:11.5px;color:var(--muted);margin:7px 0 0 22px;cursor:pointer;width:max-content;max-width:100%}
.src:hover{color:var(--accent);text-decoration:underline}
.vgroup.dim .row .tx{opacity:.62}
.vempty{color:var(--muted);font-size:13px;padding:6px 4px}
.vlink{padding:2px 4px;cursor:pointer;display:flex;gap:10px;border-radius:4px}
.vlink:hover{background:var(--hover)}
.vlink .d{color:var(--muted);font-size:12px}
.row.session{margin-top:10px;background:var(--session-bg)}
.row.session .sdate{font-weight:650;color:var(--session);line-height:22px;margin-right:8px;white-space:nowrap;cursor:pointer}
.row.session .sdate:hover{text-decoration:underline}
.row.session .tx{color:var(--muted)}
.node.flash>.row{animation:flash 1.2s}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}

/* Popover */
#pop{position:fixed;z-index:10;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;font-size:13px;display:none;min-width:230px}
#pop label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
#pop .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}

/* Toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;background:var(--text);color:var(--bg);border-radius:8px;padding:6px 8px 6px 14px;font-size:13px;display:none;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#toast button{color:inherit;border-color:currentColor;padding:1px 10px}
#toast button:hover{background:transparent;opacity:.8}

/* Empty state */
.welcome{max-width:620px;color:var(--muted);margin-top:40px}
.welcome h2{color:var(--text);font-size:18px;margin:0 0 8px}
.welcome table{border-collapse:collapse;margin-top:12px;font-size:13px}
.welcome td{padding:2px 14px 2px 0}
.welcome kbd{background:var(--pill);border-radius:4px;padding:0 5px;font:12px ui-monospace,Consolas,monospace;color:var(--text)}
</style>
</head>
<body>
<aside id="side">
  <div class="top"><button id="homeBtn" class="brand" title="Home">neoECCO</button></div>
  <div class="new">
    <button id="newMeeting" title="New meeting item">+ Meeting</button>
    <button id="newDoc" title="New document">+ Document</button>
  </div>
  <input id="filter" placeholder="Filter titles…" autocomplete="off">
  <div id="lists"></div>
  <div class="foot">
    <button id="exportBtn" title="Download a complete backup file">Export</button>
    <button id="importBtn" title="Restore from a backup file">Import</button>
    <button id="themeBtn" title="Theme">Theme: system</button>
    <button id="reloadBtn" title="Reload the page, e.g. after uploading a new version">↻ Refresh</button>
    <span id="status">Saved</span>
    <button id="syncBtn" hidden></button>
    <button id="confBtn" hidden title="Edits that a newer edit replaced; restore or dismiss them"></button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</aside>
<main id="main">
  <div id="banner" hidden></div>
  <div id="content"></div>
</main>
<div id="pop"></div>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function(){
'use strict';

/* ---------- utilities ---------- */
const KEY = 'eccopim.v1';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = (s, opt) => s ? parseISO(s).toLocaleDateString(undefined, opt || { month: 'short', day: 'numeric' }) : '';
const fmtLong = s => fmt(s, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = t => esc(t || '').replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const $ = s => document.querySelector(s);
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
function hash(str) { // cyrb53: short fingerprint of a record, to notice what changed
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

/* ---------- state ---------- */
function blank() { return { version: 2, containers: {}, bullets: {}, folders: {}, ui: { current: null, folder: null, lastExport: null, theme: null } }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.containers && o.bullets) { o.ui = o.ui || {}; return o; } }
  } catch (e) { /* storage unavailable */ }
  return null;
}
const LOADED = load();
let S = LOADED || blank();
function ensureModel() {
  if (!S.folders) S.folders = {};
  if (!S.folders.me) S.folders.me = { id: 'me', kind: 'person', name: 'Me', parentId: null, order: -1, collapsed: false };
  for (const c of Object.values(S.containers)) if (!c.links) c.links = [];
  for (const b of Object.values(S.bullets)) if (!b.links) b.links = [];
}
ensureModel();
// block selection: ids of selected bullets (visible rows), plus the anchor and moving end of the range
let bsel = new Set(), selAnchor = null, selFocus = null;

let saveTimer = null;
function setStatus(msg, err) { const s = $('#status'); s.textContent = msg; s.classList.toggle('err', !!err); }
function save() {
  setStatus('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { setStatus('Save failed. Export a backup now.', true); return; }
    if (stamp()) scheduleSync(3000);
    showSync();
  }, 250);
}
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); stamp(); } catch (e) {} });

/* ---------- undo / redo ---------- */
let undoStack = [], redoStack = [], typingSnap = false, typingTimer = null;
const snapshot = () => JSON.stringify({ c: S.containers, b: S.bullets, f: S.folders });
function snap() { undoStack.push(snapshot()); if (undoStack.length > 150) undoStack.shift(); redoStack.length = 0; typingSnap = false; }
function restoreFrom(str) {
  const o = JSON.parse(str); S.containers = o.c; S.bullets = o.b; if (o.f) S.folders = o.f; ensureModel();
  if (S.ui.current && !S.containers[S.ui.current]) S.ui.current = null;
  if (S.ui.folder && !S.folders[S.ui.folder]) S.ui.folder = null;
  bsel.clear(); selAnchor = selFocus = null; hideToast();
  save(); renderAll();
}
function undo() { if (!undoStack.length) return; const f = focusInfo(); redoStack.push(snapshot()); restoreFrom(undoStack.pop()); refocus(f); }
function redo() { if (!redoStack.length) return; const f = focusInfo(); undoStack.push(snapshot()); restoreFrom(redoStack.pop()); refocus(f); }

let toastTimer = null;
function toast(msg, canUndo) {
  const t = $('#toast'); $('#toastMsg').textContent = msg;
  $('#toastUndo').style.display = canUndo === false ? 'none' : '';
  t.style.display = 'flex';
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 8000);
}
function hideToast() { const t = $('#toast'); if (t) t.style.display = 'none'; }

/* ---------- sync: Google Drive app folder ----------
   Each browser writes only its own file (eccopim-dev-<device>.json) holding every record with its
   last-modified time; it reads the other browsers' files and keeps the newer version of each record.
   No browser ever overwrites another's file, so two laptops can't erase each other's edits. When the
   same record changed in both places since they last agreed, the newer edit wins and the other text
   goes to the Conflicts list. Deletions travel as tombstones. */
const CLIENT_ID = '893079433077-hnqv9138rg6ioje7r7qiicu5e0sf5it5.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const META_KEY = 'eccopim.meta', SYNC_KEY = 'eccopim.sync', DEV_KEY = 'eccopim.device', CONF_KEY = 'eccopim.conflicts', TOKEN_KEY = 'eccopim.token';
const COLL = { b: 'bullets', c: 'containers', f: 'folders' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
let M = lsGet(META_KEY, null), SY = lsGet(SYNC_KEY, null), CONF = lsGet(CONF_KEY, []), DEV = lsGet(DEV_KEY, null);
if (!M || !SY || !DEV || !LOADED) {
  // New or reset browser: what's here counts as older than Drive, and the browser gets a fresh identity,
  // so a file it wrote before a reset is read back like another laptop's instead of being overwritten.
  DEV = uid(); M = {};
  for (const [p, coll] of Object.entries(COLL)) for (const [id, v] of Object.entries(S[coll])) M[p + ':' + id] = { mt: 1, h: hash(JSON.stringify(v)) };
  SY = { base: {}, seen: {}, fileId: null, last: null, connected: !!(SY && SY.connected) };
  lsSet(DEV_KEY, DEV); lsSet(META_KEY, M); lsSet(SYNC_KEY, SY);
}
const saveSY = () => lsSet(SYNC_KEY, SY);

// Give every record that changed since the last call a new modified time; deleted ones become tombstones.
function stamp() {
  const now = Date.now(), live = new Set(); let n = 0;
  for (const [p, coll] of Object.entries(COLL)) for (const [id, v] of Object.entries(S[coll])) {
    const k = p + ':' + id, h = hash(JSON.stringify(v)), m = M[k]; live.add(k);
    if (!m || m.del || m.h !== h) { M[k] = { mt: now, dev: DEV, h }; n++; }
  }
  for (const k of Object.keys(M)) if (!live.has(k) && !M[k].del) { M[k] = { mt: now, dev: DEV, del: true }; n++; }
  if (n) lsSet(META_KEY, M);
  return n;
}
const dirtyKeys = () => Object.keys(M).filter(k => M[k].mt > (SY.base[k] || 0));

let token = null, tokenExp = 0, tokenClient = null;
try { const t = JSON.parse(sessionStorage.getItem(TOKEN_KEY)); if (t && t.exp > Date.now() + 60000) { token = t.token; tokenExp = t.exp; } } catch (e) {}
function dropToken() { token = null; tokenExp = 0; try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
let syncState = token ? 'ok' : (SY.connected ? 'auth' : 'off'), syncErr = '', syncing = false, syncAgain = false, syncTimer = null;

function connect() {
  const g = window.google && google.accounts && google.accounts.oauth2;
  if (!g) { syncState = 'error'; syncErr = 'Google sign-in did not load. Check the connection and reload'; showSync(); return; }
  if (!tokenClient) tokenClient = g.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: r => {
      if (!r || r.error || !r.access_token) { syncState = SY.connected ? 'auth' : 'off'; showSync(); return; }
      token = r.access_token; tokenExp = Date.now() + (Number(r.expires_in) || 3600) * 1000;
      try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ token, exp: tokenExp })); } catch (e) {}
      SY.connected = true; saveSY(); syncNow();
    },
    error_callback: () => { syncState = SY.connected ? 'auth' : 'off'; showSync(); }
  });
  tokenClient.requestAccessToken({ prompt: '' });
}

// Storage layer. Anything with list/read/write like this can replace Google Drive later.
const API = 'https://www.googleapis.com/drive/v3/files', UP = 'https://www.googleapis.com/upload/drive/v3/files';
async function gfetch(url, opt) {
  opt = opt || {}; opt.headers = Object.assign({ Authorization: 'Bearer ' + token }, opt.headers || {});
  const r = await fetch(url, opt);
  if (r.status === 401) { dropToken(); const e = new Error('Signed out'); e.auth = true; throw e; }
  if (!r.ok) { let m = 'HTTP ' + r.status; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch (_) {} const e = new Error(m); e.status = r.status; throw e; }
  return r;
}
const DriveStore = {
  async list() {

  let p = x.parentId ? S.bullets[x.parentId] : null;

}

/* ---------- outline events ---------- */
const content = $('#content');
const bulletOf = node => S.bullets[node.closest('.node').dataset.id];

/* ---------- block selection and block actions ---------- */
function selectableIds() {
  return [...content.querySelectorAll('.outline .node')].filter(n => !n.firstElementChild.classList.contains('session')).map(n => n.dataset.id);
}
function paintSel() {
  content.querySelectorAll('.row.sel').forEach(r => r.classList.remove('sel'));
  for (const n of content.querySelectorAll('.outline .node')) if (bsel.has(n.dataset.id)) n.firstElementChild.classList.add('sel');

function blurText() { const a = document.activeElement; if (a && a.classList && a.classList.contains('tx')) a.blur(); }
function clearSel() { if (!bsel.size) return; bsel.clear(); selAnchor = selFocus = null; paintSel(); }
function selectRange(a, b) {
  const list = selectableIds(), i = list.indexOf(a), j = list.indexOf(b);
  if (i < 0 || j < 0) return;
  bsel = new Set(list.slice(Math.min(i, j), Math.max(i, j) + 1)); selAnchor = a; selFocus = b;
  blurText(); paintSel();
}
// Selected bullets whose parent is not also selected, in screen order. Sub-bullets travel with these.
function selRoots() {
  const order = selectableIds();
  return [...bsel].filter(id => {
    const b = S.bullets[id]; if (!b || b.isSession) return false;
    let p = b.parentId ? S.bullets[b.parentId] : null;
    while (p) { if (bsel.has(p.id)) return false; p = p.parentId ? S.bullets[p.parentId] : null; }
    return true;
  }).sort((x, y) => order.indexOf(x) - order.indexOf(y));
}
function deleteItems(ids) {
  ids = ids.filter(id => S.bullets[id] && !S.bullets[id].isSession); if (!ids.length) return;
  snap(); let n = 0;
  for (const id of ids) if (S.bullets[id]) { n += countTree(id); deleteTree(id); }
  bsel.clear(); selAnchor = selFocus = null;
  save(); renderAll(); toast('Deleted ' + plural(n, 'bullet'));
}
function moveToContainer(ids, cid) {
  const c = S.containers[cid]; ids = ids.filter(id => S.bullets[id] && !S.bullets[id].isSession);
  if (!c || !ids.length) return;
  snap();
  for (const id of ids) { // meetings: file each under a session with the date it was written, so dates survive the move
    const b = S.bullets[id];
    const parent = c.type === 'meeting' ? sessionFor(cid, effDate(b) || todayISO()).id : null;
    b.order = orderLast(parent, cid); b.parentId = parent; setContainerDeep(b, cid);
  }

  save(); renderAll();
  const it = document.querySelector('.item[data-cid="' + cid + '"]'); if (it) it.classList.add('flash');
  toast('Moved ' + plural(ids.length, 'item') + ' to ' + (c.title || 'Untitled') + (c.type === 'meeting' ? ', under their original dates' : ''));
}
function linkItems(ids, fid) {
  ids = ids.filter(id => S.bullets[id]); if (!ids.length || !S.folders[fid]) return;
  snap();
  const n = ids.filter(id => addLink(S.bullets[id], fid)).length;

  save(); renderAll(); flashFolder(fid);

function setDoneItems(ids, val) {
  snap(); const now = new Date().toISOString();
  for (const id of ids) {
    const b = S.bullets[id]; if (!b || b.isSession) continue;
    if (val && !b.done) { b.done = true; b.doneAt = now; } else if (!val) { b.done = false; b.doneAt = null; }
  }

}
function shiftBlock(out) {
  if (S.ui.folder) { toast('Indent in the meeting or document itself; this view mixes several notes', false); return; }
  const roots = selRoots(); if (!roots.length) return;
  const rootSet = new Set(roots);
  snap(); let moved = 0;
  for (const id of (out ? roots.slice().reverse() : roots)) {

    return;
  }
  const row = e.target.closest('.row'); if (!row) return;
  if (row.classList.contains('session')) { e.preventDefault(); clearSel(); sessionPop(bulletOf(row), e.clientX, e.clientY); return; }
  e.preventDefault();
  const rid = row.closest('.node').dataset.id;
  if (bsel.size > 1 && bsel.has(rid)) { blockPop(e.clientX, e.clientY); return; }
  clearSel();
  popFor = bulletOf(row);
  const b = popFor;
  const sub = countTree(b.id) - 1;
  pop.innerHTML = '<div style="font-weight:600;margin-bottom:4px">Dates</div>' +
    '<label>Start <input type="date" id="pStart" value="' + (b.start || '') + '"></label>' +
    '<label>End <input type="date" id="pEnd" value="' + (b.end || '') + '"></label>' +
    '<div style="color:var(--muted);font-size:12px">Session date: ' + (effDate(b) ? fmtLong(effDate(b)) : 'none') + '</div>' +
    '<div style="font-weight:600;margin:10px 0 4px">Links and place</div>' +
    '<label>Link to <select id="pLink"><option value="">choose…</option>' + folderOptions(new Set(liveLinks(b).map(l => l.folder))) + '</select></label>' +
    '<label>Move to <select id="pMove"><option value="">choose…</option>' + moveOptions(b.containerId) + '</select></label>' +
    '<div class="btns"><button id="pDel" class="danger">Delete' + (sub ? ' (+' + plural(sub, 'sub-bullet') + ')' : '') + '</button>' +
    '<span style="flex:1"></span><button id="pClear">Clear dates</button><button id="pDone" class="primary">Done</button></div>';
  placePop(e.clientX, e.clientY);
  let snapped = false;
  const apply = () => {
    if (!snapped) { snap(); snapped = true; }
    let s = $('#pStart').value || null, en = $('#pEnd').value || null;
    if (s && en && en < s) { en = s; $('#pEnd').value = s; }
    b.start = s; b.end = en; save(); renderMain();
  };
  $('#pStart').onchange = apply; $('#pEnd').onchange = apply;
  $('#pLink').onchange = () => { const v = $('#pLink').value; if (!v) return; snap(); addLink(b, v); save(); closePop(); renderAll(); };
  $('#pMove').onchange = () => { const v = $('#pMove').value; if (!v) return; popFor = null; closePop(); moveToContainer([b.id], v); };
  $('#pDel').onclick = () => { popFor = null; closePop(); deleteItems([b.id]); };
  $('#pClear').onclick = () => { $('#pStart').value = ''; $('#pEnd').value = ''; apply(); closePop(); };
  $('#pDone').onclick = closePop;
});
function conflictsPop() {
  popFor = null;
  if (!CONF.length) { closePop(); showSync(); return; }
  pop.innerHTML = '<div style="font-weight:600;margin-bottom:2px">Replaced by a newer edit</div>' +
    '<div style="color:var(--muted);font-size:12px;margin-bottom:4px">The same item was changed in two places. The newer edit won; the other version is kept here.</div><div class="conf">' +
    CONF.map((c, i) => {
      const canRestore = c.k[0] === 'b' && S.bullets[c.k.slice(2)];
      return '<div class="ci"><div class="cm">' + esc(new Date(c.mt).toLocaleString()) + (c.side === 'this' ? ' · this browser' : ' · another laptop') + (canRestore ? '' : ' · item since deleted') + '</div>' +
        '<div>' + esc(c.text) + '</div><div class="btns">' + (canRestore ? '<button data-cr="' + i + '">Restore this text</button>' : '') + '<button data-cd="' + i + '">Dismiss</button></div></div>';
    }).join('') + '</div>';
  placePop(262, innerHeight);
}
pop.addEventListener('click', e => {
  const r = e.target.dataset && e.target.dataset.cr, d = e.target.dataset && e.target.dataset.cd;
  if (r === undefined && d === undefined) return;
  const i = Number(r !== undefined ? r : d), c = CONF[i]; if (!c) return;
  if (r !== undefined) { const b = S.bullets[c.k.slice(2)]; if (b) { snap(); b.text = c.text; save(); renderAll(); } }
  CONF.splice(i, 1); lsSet(CONF_KEY, CONF); showSync(); conflictsPop();
});
function closePop() { pop.style.display = 'none'; const id = popFor && popFor.id; popFor = null; if (id) refocus({ id, pos: 'end' }); }
document.addEventListener('mousedown', e => { if (pop.style.display === 'block' && !pop.contains(e.target)) closePop(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && pop.style.display === 'block') { closePop(); return; }
  const mod = e.ctrlKey || e.metaKey;
  const inField = e.target.matches && e.target.matches('input, select, textarea');
  if (mod && !inField && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (mod && !inField && (e.key === 'y' || ((e.key === 'z' || e.key === 'Z') && e.shiftKey))) { e.preventDefault(); redo(); }
}, true);
// Keys while a block is selected (no text has focus then).
document.addEventListener('keydown', e => {
  if (!bsel.size || pop.style.display === 'block') return;
  const t = e.target; if (t.matches && t.matches('input, select, textarea, .tx')) return;
  if (e.key === 'Escape') { clearSel(); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); deleteItems(selRoots()); return; }
  if (e.key === 'Tab') { e.preventDefault(); shiftBlock(e.shiftKey); return; }
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Enter') && !e.ctrlKey && !e.metaKey) {
    e.preventDefault(); const up = e.key === 'ArrowUp';
    const ord = selectableIds().filter(id => bsel.has(id)); const id = up || e.key === 'Enter' ? ord[0] : ord[ord.length - 1];
    clearSel(); if (id) refocus({ id, pos: up ? 0 : 'end' });
  }
});

/* ---------- drag and drop ---------- */
let drag = null, dropAt = null;
function clearDropMarks() { document.querySelectorAll('.drop,.drop-before,.drop-after,.drop-child').forEach(n => n.classList.remove('drop', 'drop-before', 'drop-after', 'drop-child')); }
function isDesc(t, ancestorId) { let x = t; while (x) { if (x.id === ancestorId) return true; x = x.parentId ? S.bullets[x.parentId] : null; } return false; }
function flashFolder(fid) { const it = document.querySelector('.item.folder[data-fid="' + fid + '"]'); if (it) it.classList.add('flash'); }
document.addEventListener('dragstart', e => {
  const t = e.target.nodeType === 1 ? e.target : e.target.parentElement;
  const tw = t.closest('.tw[draggable="true"]'), grip = t.closest('.grip'), fi = t.closest('.item.folder');
  if (tw) {
    const b = bulletOf(tw);
    const ids = bsel.has(b.id) && bsel.size > 1 ? selRoots() : [b.id];
    if (!bsel.has(b.id)) clearSel();
    drag = { type: 'bullet', ids };
    e.dataTransfer.setData('text/plain', ids.length > 1 ? plural(ids.length, 'item') : (b.text || '')); e.dataTransfer.effectAllowed = 'all';
    try { e.dataTransfer.setDragImage(tw.closest('.row'), 12, 11); } catch (_) {}
  } else if (grip && S.ui.current) {
    drag = { type: 'container', id: S.ui.current }; e.dataTransfer.setData('text/plain', S.containers[S.ui.current].title || ''); e.dataTransfer.effectAllowed = 'all';
  } else if (fi) {
    drag = { type: 'folder', id: fi.dataset.fid }; e.dataTransfer.setData('text/plain', folderName(fi.dataset.fid)); e.dataTransfer.effectAllowed = 'move';
  } else drag = null;
});
document.addEventListener('dragend', () => { drag = null; dropAt = null; clearDropMarks(); });
function canDropOnFolder(fid) {
  if (!drag) return false;
  if (drag.type === 'folder') { const a = S.folders[drag.id], b = S.folders[fid]; return a && b && a.kind === b.kind && !folderDesc(drag.id).has(fid); }
  return true;
}
const lists = $('#lists');
lists.addEventListener('dragover', e => {
  if (!drag) return;
  clearDropMarks();
  const fi = e.target.closest('.item.folder'), hdr = e.target.closest('.fsec'), ci = e.target.closest('.item[data-cid]');
  if (fi && canDropOnFolder(fi.dataset.fid)) { e.preventDefault(); e.dataTransfer.dropEffect = drag.type === 'folder' ? 'move' : 'link'; fi.classList.add('drop'); }
  else if (ci && drag.type === 'bullet') { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; ci.classList.add('drop'); }
  else if (hdr && drag.type === 'folder' && S.folders[drag.id] && S.folders[drag.id].kind === hdr.dataset.kind) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; hdr.classList.add('drop'); }
});
lists.addEventListener('dragleave', e => { if (!lists.contains(e.relatedTarget)) clearDropMarks(); });
lists.addEventListener('drop', e => {
  if (!drag) return;
  e.preventDefault(); clearDropMarks();
  const fi = e.target.closest('.item.folder'), hdr = e.target.closest('.fsec'), ci = e.target.closest('.item[data-cid]');
  const f = focusInfo();
  if (fi && canDropOnFolder(fi.dataset.fid)) {
    const fid = fi.dataset.fid;
    if (drag.type === 'bullet') { const ids = drag.ids; drag = null; linkItems(ids, fid); refocus(f); return; }
    if (drag.type === 'container') { const c = S.containers[drag.id]; snap(); if (!addLink(c, fid)) setStatus(folderName(fid) + ' is already linked'); }
    else if (drag.type === 'folder') { snap(); S.folders[drag.id].parentId = fid; S.folders[fid].collapsed = false; }
    save(); renderAll(); refocus(f); flashFolder(fid);
  } else if (ci && drag.type === 'bullet') { const ids = drag.ids; drag = null; moveToContainer(ids, ci.dataset.cid); return; }
  else if (hdr && drag.type === 'folder') { snap(); S.folders[drag.id].parentId = null; save(); renderAll(); refocus(f); }
  drag = null;
});
function dropZone(row, t, e) {
  if (t.isSession) return 'child';
  const r = row.getBoundingClientRect(), lower = e.clientY > r.top + r.height / 2;
  const tx = row.querySelector('.tx').getBoundingClientRect();
  if (lower && e.clientX > tx.left + 40) return 'child';
  return lower ? 'after' : 'before';
}
content.addEventListener('dragover', e => {
  if (!drag) return;
  e.preventDefault(); // never let the browser drop text into a note
  clearDropMarks(); dropAt = null; e.dataTransfer.dropEffect = 'none';
  if (drag.type !== 'bullet') return;
  const row = e.target.closest('.outline .row'); if (!row) return;
  const t = bulletOf(row);
  if (!t || drag.ids.some(id => !S.bullets[id] || isDesc(t, id))) return;
  const zone = dropZone(row, t, e);
  row.classList.add('drop-' + zone); dropAt = { t: t.id, zone }; e.dataTransfer.dropEffect = 'move';
});
content.addEventListener('drop', e => {
  if (!drag) return;
  e.preventDefault(); clearDropMarks();
  if (drag.type !== 'bullet' || !dropAt) { drag = null; return; }
  const ids = drag.ids.filter(id => S.bullets[id]), t = S.bullets[dropAt.t]; drag = null;
  if (!ids.length || !t) { dropAt = null; return; }
  snap();
  const cid = t.containerId, moving = new Set(ids);
  if (dropAt.zone === 'child') { t.collapsed = false; placeAt(ids, t.id, cid, 0); }
  else {
    const sib = childList(t.parentId, cid).filter(x => !moving.has(x.id));
    placeAt(ids, t.parentId, cid, sib.indexOf(t) + (dropAt.zone === 'after' ? 1 : 0));
  }
  dropAt = null;
  if (ids.length === 1) { bsel.clear(); commit(ids[0], 'end'); } else { save(); renderAll(); }
});
lists.addEventListener('contextmenu', e => {
  const fi = e.target.closest('.item.folder'); if (!fi) return;
  e.preventDefault();
  const f = S.folders[fi.dataset.fid]; popFor = null;
  pop.innerHTML = '<div style="font-weight:600;margin-bottom:4px">' + esc(folderPath(f.id)) + '</div><div class="menu">' +
    '<button id="fOpen">Open</button><button id="fRen">Rename</button><button id="fSub">New sub-folder</button>' +
    (f.parentId ? '<button id="fTop">Move to top level</button>' : '') +
    (f.id !== 'me' ? '<button id="fDel">Delete…</button>' : '') + '</div>';
  placePop(e.clientX, e.clientY);
  $('#fOpen').onclick = () => { closePop(); openFolder(f.id); };
  $('#fRen').onclick = () => { closePop(); openFolder(f.id, true); const t = $('.head .title'); if (t) t.select(); };
  $('#fSub').onclick = () => { closePop(); newFolder(f.kind, f.id); };
  if ($('#fTop')) $('#fTop').onclick = () => { snap(); f.parentId = null; save(); closePop(); renderAll(); };
  if ($('#fDel')) $('#fDel').onclick = () => { closePop(); deleteFolder(f.id); };
});

/* ---------- sidebar & footer ---------- */
$('#homeBtn').onclick = () => { // Home: the start screen for now; becomes the Today view in stage 4
  if (S.ui.current) cleanupEmptySession(S.ui.current);
  bsel.clear(); selAnchor = selFocus = null;
  S.ui.current = null; S.ui.folder = null; save(); renderAll(); $('#main').scrollTop = 0;
};
$('#reloadBtn').textContent = '↻ Refresh (' + (isMac ? '⌘R' : 'Ctrl+R') + ')';
$('#reloadBtn').onclick = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); stamp(); } catch (e) {} location.reload(); };
$('#newMeeting').onclick = () => createContainer('meeting');
$('#newDoc').onclick = () => createContainer('document');
$('#filter').addEventListener('input', renderSidebar);
$('#themeBtn').onclick = () => { const order = [null, 'light', 'dark']; S.ui.theme = order[(order.indexOf(S.ui.theme || null) + 1) % 3]; save(); applyTheme(); };
$('#toastUndo').onclick = () => { hideToast(); undo(); };

function exportData() {
  const data = JSON.stringify({ app: 'ecco-pim', version: 2, exportedAt: new Date().toISOString(), containers: S.containers, bullets: S.bullets, folders: S.folders }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = 'pim-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  S.ui.lastExport = new Date().toISOString(); save(); renderBanner();
}
$('#exportBtn').onclick = exportData;
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o.containers !== 'object' || typeof o.bullets !== 'object') throw new Error('Not a backup file');
      const n = Object.values(o.containers).filter(c => c.type !== 'inbox').length, m = Object.keys(o.bullets).length, k = o.folders ? Object.keys(o.folders).length : 0;
      if (!confirm('Replace everything with this backup (' + n + ' meetings/documents, ' + m + ' bullets, ' + k + ' people/projects)?' + (SY.connected ? '\nThis also replaces your notes in Drive and on your other laptops.' : '') + '\n(Ctrl+Z undoes this.)')) return;
      snap(); S.containers = o.containers; S.bullets = o.bullets; S.folders = o.folders || {}; ensureModel(); S.ui.current = null; S.ui.folder = null; save(); renderAll();
    } catch (err) { alert('Could not import: ' + err.message); }
    e.target.value = '';
  };
  r.readAsText(f);
};

/* ---------- start ---------- */
(function startupCleanup() {
  for (const c of Object.values(S.containers)) {
    if (c.type !== 'meeting') continue;
    for (const s of sessionsOf(c.id)) if (!(c.id === S.ui.current && s.date === todayISO()) && treeEmpty(s.id)) deleteTree(s.id);
  }
})();
if (S.ui.current && S.containers[S.ui.current]) openContainer(S.ui.current);
else { S.ui.current = null; if (S.ui.folder && !S.folders[S.ui.folder]) S.ui.folder = null; renderAll(); }
$('#syncBtn').onclick = () => { if (syncState === 'error' && token) syncNow(); else connect(); };
$('#confBtn').onclick = () => conflictsPop();
window.addEventListener('online', () => syncNow());
window.addEventListener('offline', () => { if (SY.connected) { syncState = 'offline'; showSync(); } });
// Keep a copy of the page in the browser so it opens without a network (needs sw.js next to index.html).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) syncNow(); });
setInterval(() => { if (!document.hidden && (token || syncState === 'ok')) syncNow(); }, 60000); // pick up other laptops' edits
showSync();
if (token) syncNow();
})();
</script>
</body>
</html>
