<style>
/* Parchment palette. Color carries meaning, and the same color means the same thing everywhere:
   green = people, amber = projects, indigo = meetings and their dated sessions, blue = links and actions,
   red = errors. Text colors keep at least 4.5:1 contrast on their background. */
:root{
  --bg:#fbf7ec; --panel:#f2ead8; --text:#2b2620; --muted:#6b6152; --faint:#b3a78f;
  --line:#e2d7bf; --accent:#2c5aa8; --accent-bg:#e2e8f2; --hover:#efe6d1;
  --done:#958a76; --warn-bg:#f6e3b8; --warn:#5f4500; --session:#4a3c8c; --session-bg:#ebe5f0;
  --pill:#ebe1cb; --err:#b3261e; --doc:#6b6152;
  --per:#1c6847; --per-bg:#dcecdc; --prj:#8a4300; --prj-bg:#f6dfbf;
}
@media (prefers-color-scheme: dark){ /* light or dark follows the system setting */
  :root{
  --bg:#1e1c18; --panel:#26231e; --text:#ece6d8; --muted:#a69d8c; --faint:#5f584c;
  --line:#38332b; --accent:#8fb0ff; --accent-bg:#27324a; --hover:#2e2a23;
  --done:#7f7768; --warn-bg:#3b3120; --warn:#e8c56a; --session:#bcadff; --session-bg:#2b2740;
  --pill:#322d25; --err:#ff8a80; --doc:#a69d8c;
  --per:#86d3b0; --per-bg:#1f3a2f; --prj:#f0b46a; --prj-bg:#3d2e1a;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 6px}

/* Sidebar */
#side{width:250px;min-width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
#side .top{padding:12px 12px 6px;display:flex;align-items:center;gap:6px}
#side .brand{font-weight:700;letter-spacing:.2px;flex:1;border:none;padding:0;background:none;text-align:left;cursor:pointer}
#side .brand:hover{background:none;color:var(--accent)}
#side .new{display:flex;gap:6px;padding:0 12px 8px}
#side .new button{flex:1}
#filter{margin:0 12px 8px;width:calc(100% - 24px)}
#lists{flex:1;overflow:auto;padding-bottom:8px}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 14px 3px;font-weight:600}
.item{display:flex;gap:6px;align-items:baseline;padding:2px 14px;cursor:pointer;white-space:nowrap;overflow:hidden}
.item:hover{background:var(--hover)}
.item.cur{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
/* a small colored dot says what kind of thing each sidebar entry is */
.item .t::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--dot,transparent)}
.item.k-person{--dot:var(--per)} .item.k-project{--dot:var(--prj)} .item.k-meeting{--dot:var(--session)} .item.k-document{--dot:var(--doc)}
.item .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:11px;color:var(--muted)}
.empty-note{color:var(--muted);font-size:12px;padding:2px 14px}
.fsec{display:flex;align-items:center}
.fsec span{flex:1}
.fsec .add{border:none;padding:0 6px;font-size:15px;line-height:1;color:var(--muted)}
.fsec .add:hover{color:var(--text)}
.item.folder{padding-right:10px}
.item.folder .ftw{width:15px;flex:0 0 15px;color:var(--muted);font-size:10px;cursor:pointer;align-self:center;display:flex;align-items:center}
/* expand/collapse for sub-folders: a boxed + / − (a bare + already means "add" in the section headers) */
.item.folder .ftw.tog{box-sizing:border-box;width:13px;flex:0 0 13px;height:13px;margin-right:2px;justify-content:center;border:1.5px solid var(--muted);border-radius:3px;color:var(--text);font-size:12px;font-weight:800;line-height:1;background:var(--bg)}
.item.folder .ftw.tog:hover{border-color:var(--text)}
.item .cnt{font-size:11px;color:var(--muted);background:var(--pill);border-radius:8px;padding:0 6px}
.item.drop,.fsec.drop{background:var(--accent-bg);outline:1px dashed var(--accent);outline-offset:-1px}
.item.flash{animation:flash 1.2s}
#pop .menu button{display:block;width:100%;text-align:left;border:none;padding:4px 6px}
#pop select{max-width:200px}
#pop .danger{color:var(--err)}
#pop .note{color:var(--muted);font-size:12px;max-width:300px}
#side .foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
#status{color:var(--muted);flex:1 0 100%}
#status.err{color:var(--err)}
#side .foot button[hidden]{display:none}
/* a button that needs you now (Reconnect, Export when a backup is due): dark, pulsing */
#side .foot button.urgent{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600;animation:pulse 1.6s ease-in-out infinite}
#side .foot button.urgent:hover{opacity:.85}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,111,222,.6)}50%{box-shadow:0 0 0 6px rgba(47,111,222,0)}}
@media (prefers-reduced-motion: reduce){#side .foot button.urgent{animation:none}}
#pop .conf{max-height:50vh;overflow:auto;max-width:420px}
#pop .ci{border-top:1px solid var(--line);padding:6px 0;white-space:pre-wrap;word-break:break-word}
#pop .ci .cm{font-size:11.5px;color:var(--muted)}
#pop .ci .btns{margin-top:4px}


/* Timeline (stage 6) */
.tl{max-width:1400px;-webkit-user-select:none;user-select:none;font-size:13px}
.tl .tr{display:grid;grid-template-columns:var(--tlw,280px) minmax(0,1fr);align-items:stretch;min-height:24px}
.tl .lab{padding:2px 10px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:20px}
.tl .lab:hover{color:var(--accent)}
.tl .lab .who{color:var(--muted);font-size:11.5px;margin-left:6px}
.tl .trk{position:relative;border-left:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden}
.tl .hd{position:sticky;top:0;z-index:2;background:var(--bg)}
.tl .hd .trk{height:34px;border-bottom:1px solid var(--line)}
.tl .mo{position:absolute;top:1px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding-left:4px;border-left:1px solid var(--line);height:32px;white-space:nowrap}
.tl .wk{position:absolute;bottom:1px;font-size:10.5px;color:var(--faint);padding-left:3px;white-space:nowrap}
.tl .grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.55}
.tl .now{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--accent);z-index:1}
.tl .grp{margin-top:10px}
.tl .grp > .lab{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:650;color:var(--prj)}
.tl .grp.none > .lab{color:var(--muted)}
.tl .grp .trk{border-bottom:1px solid var(--line)}
.tl .ses{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--session);cursor:pointer}
.tl .bar{position:absolute;top:5px;height:14px;border-radius:4px;background:var(--prj);opacity:.85;cursor:pointer;min-width:4px}
.tl .bar:hover,.tl .mk:hover,.tl .ses:hover{outline:2px solid var(--accent);outline-offset:1px}
.tl .bar.cutl{border-top-left-radius:0;border-bottom-left-radius:0}
.tl .bar.cutr{border-top-right-radius:0;border-bottom-right-radius:0}
.tl .bar.from{background:linear-gradient(90deg,var(--prj) 60%,transparent)}
.tl .mk{position:absolute;top:6px;width:11px;height:11px;margin-left:-5.5px;transform:rotate(45deg);background:var(--prj);cursor:pointer}
.tl .late .bar,.tl .late .mk{background:var(--err)}
.tl .late .bar.from{background:linear-gradient(90deg,var(--err) 60%,transparent)}
.tl .late .lab{color:var(--err)}
.tl .done .bar,.tl .done .mk{background:var(--done);opacity:.5}
.tl .done .lab{color:var(--done);text-decoration:line-through}
.tl .tli .trk{border-bottom:1px dotted var(--line)}
.tl .tli:hover{background:var(--hover)}
.tlkey{display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap}
.tlkey i{display:inline-block;vertical-align:-1px;margin-right:4px}
.tlkey .kb{width:18px;height:9px;border-radius:3px;background:var(--prj)}
.tlkey .km{width:8px;height:8px;transform:rotate(45deg);background:var(--prj)}
.tlkey .ks{width:7px;height:7px;border-radius:50%;background:var(--session)}
.tlout{color:var(--muted);font-size:12.5px;margin:10px 0}
@media (max-width: 760px){.tl{--tlw:120px}.tl .lab .who{display:none}.tlkey{display:none}}

/* Main */
#main{flex:1;height:100%;overflow:auto;display:flex;flex-direction:column}
#banner{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:5px 24px;display:flex;gap:10px;align-items:center}
#banner[hidden]{display:none}
#content{padding:16px 28px 120px;width:100%}
.head .title{font-size:20px;font-weight:650;border:none;background:transparent;width:100%;padding:2px 0;outline:none}
.head .title::placeholder{color:var(--faint)}
.head .sub{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.head .sub select{font-size:12.5px;max-width:200px;padding:0 4px}
.head .sub .go{border:none;color:var(--accent);padding:0 3px}
.head .sub .del{margin-left:auto;font-size:12px;color:var(--muted)}
.head .sub .del + .del{margin-left:0}

.strip{border:1px solid var(--line);border-radius:7px;margin:0 0 12px;padding:6px 10px;background:var(--panel);-webkit-user-select:none;user-select:none}
.strip .h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:2px}
.strip .oi{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.strip .oi .t{cursor:pointer;flex:1}
.strip .oi .t:hover{text-decoration:underline}
.strip .none{color:var(--muted);font-size:12.5px}

/* Outline */
.outline{max-width:1100px}
.node{position:relative}
.kids{margin-left:11px;padding-left:10px;border-left:1px solid var(--line)}
.row{display:flex;align-items:flex-start;gap:4px;min-height:22px;border-radius:4px;padding:0 4px;position:relative}
/* drag grip for rows with sub-bullets (their boxed +/- is mainly the expand/collapse control): shows on hover, left of the box */
.dg{position:absolute;left:-12px;top:0;width:12px;text-align:center;line-height:22px;font-size:13px;color:var(--muted);cursor:grab;opacity:0;user-select:none}
.row:hover>.dg,.row.sel>.dg{opacity:1}
.dg:hover{color:var(--text)}
.row:hover{background:var(--hover)}
.row.sel,.row.sel:hover{background:var(--accent-bg);box-shadow:inset 2px 0 0 var(--accent)}
body.sweeping,body.sweeping *{-webkit-user-select:none!important;user-select:none!important}
.tw{width:14px;flex:0 0 14px;text-align:center;color:var(--faint);font-size:11px;line-height:22px;user-select:none}
.tw.has{cursor:pointer;color:var(--text);box-sizing:border-box;width:13px;flex:0 0 13px;height:13px;margin:4.5px 1px 0 0;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--muted);border-radius:3px;font-size:12px;font-weight:800;line-height:1;background:var(--bg)}
.tw.has:hover{border-color:var(--text)}
.ck{margin:5px 2px 0 0;opacity:0;cursor:pointer;flex:0 0 auto}
input[type="checkbox"]{accent-color:var(--accent)}
.row:hover .ck,.ck.show,.ck:focus{opacity:1}
.tx{flex:1;outline:none;min-width:40px;line-height:22px;white-space:pre-wrap;word-break:break-word}
.tx:empty:before{content:attr(data-ph);color:var(--faint)}
.tx a{color:var(--accent);text-decoration:underline;cursor:pointer}
.row.done .tx{text-decoration:line-through;color:var(--done)}
.meta{flex:0 0 auto;display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--muted);line-height:22px;white-space:nowrap}
.pill{background:var(--pill);border-radius:9px;padding:0 7px;line-height:17px}
.tag{border-radius:9px;padding:0 7px;line-height:17px;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;white-space:nowrap}
.tag.person{background:var(--per-bg);color:var(--per)}
.tag.project{background:var(--prj-bg);color:var(--prj)}
.tag.pri{font-weight:700;border-color:currentColor}
/* a note link files the bullet under the person/project without making it a task: dashed, no fill */
.tag.note{background:transparent;border:1px dashed currentColor;font-weight:400}
.tag .x{margin-left:5px;opacity:.55}
.tag .x:hover{opacity:1}
.tw[draggable="true"]{cursor:grab}
.row.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.row.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.row.drop-child{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.head .trow{display:flex;align-items:center}
.grip{cursor:grab;color:var(--faint);font-size:15px;padding:0 6px 0 0;user-select:none}
.grip:hover{color:var(--text)}
.head .sub .chips{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.additem{width:100%;max-width:1100px;margin:2px 0 10px;padding:5px 9px;border-radius:7px;display:block;resize:none;overflow:hidden;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);line-height:1.55;height:auto}
.vsec{display:flex;gap:6px;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin:16px 0 2px;max-width:1100px;border-bottom:1px solid var(--line);padding-bottom:2px}
.vsec.tog{cursor:pointer}
.vsec.tog:hover{color:var(--text)}
.vsec .n{font-weight:500}
.src{font-size:11.5px;color:var(--muted);margin:7px 0 0 22px;cursor:pointer;width:max-content;max-width:100%}
.src:hover{color:var(--accent);text-decoration:underline}
.vgroup.dim .row .tx{opacity:.62}
.vempty{color:var(--muted);font-size:13px;padding:6px 4px}
.vlink{padding:2px 4px;cursor:pointer;display:flex;gap:10px;border-radius:4px}
.vlink:hover{background:var(--hover)}
.vlink .d{color:var(--muted);font-size:12px}
.row.session{margin-top:10px;background:var(--session-bg)}
.row.session .sdate{font-weight:650;color:var(--session);line-height:22px;margin-right:8px;white-space:nowrap;cursor:pointer}
.row.session .sdate:hover{text-decoration:underline}
.row.session .tx{color:var(--muted)}
.node.flash>.row{animation:flash 1.2s}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}

/* Popover */
#pop{position:fixed;z-index:10;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;font-size:13px;display:none;min-width:230px}
#pop label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
#pop .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}

/* Toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;background:var(--text);color:var(--bg);border-radius:8px;padding:6px 8px 6px 14px;font-size:13px;display:none;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#toast button{color:inherit;border-color:currentColor;padding:1px 10px}
#toast button:hover{background:transparent;opacity:.8}

/* Sidebar views (Today, Calendar, Search) */
.item.nav .t::before{display:none}
.item.nav .ic{width:14px;flex:0 0 14px;text-align:center;color:var(--muted)}
.item .cnt.late{background:var(--err);color:var(--bg)}
.pill.late{background:transparent;color:var(--err);border:1px solid currentColor;line-height:15px}
.row.late{box-shadow:inset 2px 0 0 var(--err)}
.att{margin:2px 0 6px 44px;display:inline-flex;flex-direction:column;gap:3px;max-width:calc(100% - 52px);cursor:pointer;color:var(--muted);font-size:12px}
.att.img img{display:block;max-width:min(560px,100%);max-height:320px;border-radius:6px;border:1px solid var(--line, rgba(0,0,0,.12));background:var(--hover)}
.att:not(.img) .fname{color:var(--link, var(--accent));font-size:13px}
.att:hover .fname{text-decoration:underline}
.att.missing{cursor:default}.att.missing:hover .fname{text-decoration:none}
.att.missing.img img{display:none}
.head .sub button.attach{cursor:pointer}
@media (max-width:760px){.att{margin-left:30px;max-width:calc(100% - 34px)}.att.img img{max-height:240px}}
.row.late .tx,.row.late .meta{color:var(--err)}

/* Day view and calendar */
.dtitle{font-size:20px;font-weight:650;padding:2px 0}
.dnav{display:inline-flex;gap:4px;align-items:center}
.dnav button{padding:0 8px}
.vsec.late{color:var(--err)}
.rkzone{min-height:30px;border-radius:6px}
.rk{flex:0 0 18px;width:18px;text-align:center;line-height:22px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:15px}
.rk:hover{color:var(--text)}
.rkbtns{display:none;gap:3px;flex:0 0 auto;margin-left:4px}
.row:hover>.rkbtns,.row:focus-within>.rkbtns{display:inline-flex}
.rkbtns button{padding:0 7px;font-size:12px;line-height:19px;margin-top:1px}
.rkit.dragging{opacity:.35}
.rkit.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.rkit.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.rkzone.drop-in,.vsec.drop-in{background:var(--accent-bg)}
.rkghost{position:fixed;z-index:60;pointer-events:none;background:var(--bg);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:.95}
body.rkdragging,body.rkdragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.rkempty{color:var(--muted);font-size:12.5px;padding:7px 10px;border:1px dashed var(--line);border-radius:6px;margin:4px 0}
@media (max-width:760px),(pointer:coarse){.rkbtns{display:inline-flex}.rk{flex-basis:26px;width:26px;font-size:18px}}
.vlink .k{width:7px;height:7px;border-radius:50%;flex:0 0 7px;align-self:center;background:var(--doc)}
.vlink .k.meeting{background:var(--session)} .vlink .k.inbox{background:var(--per)}
.vlink .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);max-width:1400px;-webkit-user-select:none;user-select:none}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding:3px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.cal .cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 4px 4px;cursor:pointer;min-width:0}
.cal .cell:hover{background:var(--hover)}
.cal .cell.out{background:var(--panel)}
.cal .cell.out .dn{color:var(--faint)}
.cal .dn{font-size:12px;color:var(--muted);font-weight:600;display:inline-block;padding:0 5px;border-radius:9px;margin-bottom:1px}
.cal .cell.today .dn{background:var(--accent);color:var(--bg)}
.cal .ev{font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:0 3px}
.cal .ev:hover{background:var(--accent-bg)}
.cal .ev.s{color:var(--session);font-weight:600}
.cal .ev.s::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--session);margin-right:4px;vertical-align:1px}
.cal .ev.late{color:var(--err)}
.cal .ev.d{color:var(--done);text-decoration:line-through}
.cal .more{font-size:11.5px;color:var(--muted);padding:0 3px}
.cal .more:hover{color:var(--accent);text-decoration:underline}

/* Search */
.sbox{width:100%;max-width:1100px;font-size:16px;padding:5px 10px;border-radius:7px}
.sopts{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12.5px;margin:6px 0 4px;max-width:1100px}
.sopts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.shits{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
.shits .lab{color:var(--muted);font-size:12.5px;margin-right:2px}
.shits .doc{background:var(--pill);color:var(--text)} .shits .meeting{background:var(--session-bg);color:var(--session)}
.sres .row .tx:not(:focus){display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
::highlight(srch){background-color:var(--warn-bg);color:var(--warn)}

/* Empty state */
.welcome{max-width:620px;color:var(--muted);margin-top:40px}
.welcome h2{color:var(--text);font-size:18px;margin:0 0 8px}
.welcome table{border-collapse:collapse;margin-top:12px;font-size:13px}
.welcome td{padding:2px 14px 2px 0}
.welcome kbd{background:var(--pill);border-radius:4px;padding:0 5px;font:12px ui-monospace,Consolas,monospace;color:var(--text)}

/* Menu button: hide/show the sidebar (stage 4.6). Phones (<= 760 px): the sidebar is a drawer over the page. */
#menuBtn{position:fixed;top:8px;left:8px;z-index:6;width:32px;height:32px;padding:0;font-size:18px;line-height:30px;text-align:center;background:var(--panel);border-radius:6px}
#side .top{padding-left:48px}
body.navHidden #side{display:none}
body.navHidden #content{padding-left:56px}
#navShade{display:none}
@media (max-width: 760px){
  #menuBtn{width:40px;height:40px;line-height:38px;font-size:22px}
  #side{position:fixed;top:0;left:0;bottom:0;z-index:5;width:min(86vw,320px);min-width:0;transform:translateX(-102%);transition:transform .18s ease;box-shadow:4px 0 24px rgba(0,0,0,.25)}
  #side .top{padding-left:58px;min-height:56px}
  body.navOpen #side{transform:none}
  body.navHidden #side{display:flex}
  body.navOpen #navShade{display:block;position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.3)}
  #content,body.navHidden #content{padding:58px 12px 120px}
}
@media (max-width: 760px) and (prefers-reduced-motion: reduce){#side{transition:none}}
</style>
</head>
<body>
<button id="menuBtn" title="Hide / show the sidebar" aria-label="Menu" aria-expanded="true">☰</button>
<div id="navShade"></div>
<aside id="side">
  <div class="top"><button id="homeBtn" class="brand" title="Home">Hinay</button></div>
  <div class="new">
    <button id="newMeeting" title="New meeting item">+ Meeting</button>
    <button id="newDoc" title="New file: a notes page with no dates, for pictures, PDFs and reference notes">+ File</button>
  </div>
  <input id="filter" placeholder="Filter titles…" autocomplete="off">
  <div id="lists"></div>
  <div class="foot">
    <button id="exportBtn" title="Download a complete backup file">Export</button>
    <button id="importBtn" title="Restore from a backup file">Import</button>
    <button id="reloadBtn" title="Reload the page, e.g. after uploading a new version">↻ Refresh</button>
    <button id="usage" title="How much of this browser's note storage is used"></button>
    <span id="status">Saved</span>
    <button id="syncBtn" hidden></button>
    <button id="confBtn" hidden title="Edits that a newer edit replaced; restore or dismiss them"></button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <input type="file" id="attachFile" multiple hidden>
  </div>
</aside>
<main id="main">
  <div id="banner" hidden></div>
  <div id="content"></div>
</main>
<div id="pop"></div>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function(){
'use strict';

/* ---------- utilities ---------- */
const KEY = 'eccopim.v1';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = (s, opt) => s ? parseISO(s).toLocaleDateString(undefined, opt || { month: 'short', day: 'numeric' }) : '';

  for (const f of files) {

/* Merge a meeting or document into another one: every note moves (never copied). Into a meeting, each
   dated session joins the target's session for the same date (created if needed), keeping its topic.
   Into a document, each session becomes a plain heading bullet ("Thu, Oct 29, 2026 — topic") over its notes.
   Attendees are added to the target; the target keeps its own project unless it has none. Then the source
   is deleted. */
function mergeContainer(cid, into) {
  const c = S.containers[cid], d = S.containers[into];
  if (!c || !d || cid === into || c.type === 'inbox' || d.type === 'inbox') return;
  snap();
  let n = 0;
  for (const t of childList(null, cid)) {
    if (t.isSession && treeEmpty(t.id)) { deleteTree(t.id); continue; }
    if (t.isSession && d.type === 'meeting') {
      const s = sessionFor(into, t.date);
      if ((t.text || '').trim() && !(s.text || '').trim()) s.text = t.text;
      for (const k of childList(t.id, cid)) { k.order = orderLast(s.id, into); k.parentId = s.id; setContainerDeep(k, into); n += countTree(k.id); }
      delete S.bullets[t.id];
    } else if (t.isSession) {
      t.text = fmtLong(t.date) + ((t.text || '').trim() ? ' — ' + t.text.trim() : '');
      t.isSession = false; t.date = null; t.collapsed = false;
      t.order = orderLast(null, into); t.parentId = null; setContainerDeep(t, into); n += countTree(t.id) - 1;
    } else {
      const parent = d.type === 'meeting' ? sessionFor(into, effDate(t) || todayISO()).id : null;
      t.order = orderLast(parent, into); t.parentId = parent; setContainerDeep(t, into); n += countTree(t.id);
    }
  }
  for (const b of Object.values(S.bullets)) if (b.containerId === cid) delete S.bullets[b.id]; // strays only
  for (const l of liveLinks(c)) {
    const kind = S.folders[l.folder].kind;
    if (kind === 'person' && !d.links.some(x => x.folder === l.folder)) d.links.push({ folder: l.folder, role: 'secondary' });
    if (kind === 'project' && !containerProject(d)) { addLink(d, l.folder); setRole(d, l.folder, 'primary'); }
  }
  setChain(c, 'prev', null); setChain(c, 'next', null);
  delete S.containers[cid];
  if (S.ui.current === cid) S.ui.current = null;
  openContainer(into);
  toast('Merged ' + (c.title || 'Untitled') + ' into ' + (d.title || 'Untitled') + ' (' + plural(n, 'note') + ')');
}
function mergeContainerPop(cid, x, y) {
  const c = S.containers[cid]; if (!c) return;
  popFor = null;
  const opts = moveOptions(cid), any = Object.values(S.containers).some(o => o.id !== cid && (o.type === 'meeting' || o.type === 'document'));
  pop.innerHTML = '<div style="font-weight:600;margin-bottom:4px">Merge ' + esc(c.title || 'Untitled') + ' into…</div>' +
    '<div class="note">All its notes move to the meeting or file you pick, under their original dates. Then this ' + kindName(c) + ' is deleted. Nothing is copied or lost.</div>' +
    (any ? '<label>Into <select id="mInto"><option value="">choose…</option>' + opts + '</select></label>'
         : '<div class="note" style="margin-top:6px">There is no other meeting or file yet.</div>') +
    '<div class="btns"><button id="mCancel">Cancel</button><button id="mGo" class="primary" disabled>Merge</button></div>';
  placePop(x, y);
  const sel = $('#mInto');
  if (sel) sel.onchange = () => { $('#mGo').disabled = !sel.value; };
  $('#mCancel').onclick = closePop;
  $('#mGo').onclick = () => { const v = sel && sel.value; if (!v) return; closePop(); mergeContainer(cid, v); };
}

/* ---------- containers ---------- */
function createContainer(type) {
  snap();

  S.containers[c.id] = c;

}
function cleanupEmptySession(cid) {
  const c = S.containers[cid]; if (!c || c.type !== 'meeting') return;
  for (const s of sessionsOf(cid)) if (s.date === todayISO() && treeEmpty(s.id)) deleteTree(s.id);
}
function openContainer(id, focusTitle) {
  closeNav();

  bsel.clear(); selAnchor = selFocus = null;
  S.ui.current = id; S.ui.folder = null;
  const c = S.containers[id];
  let focusId = null;
  if (c.type === 'meeting') {
    const today = todayISO();
    let s = sessionsOf(id).find(x => x.date === today);
    if (!s) {
      for (const o of sessionsOf(id)) o.collapsed = true;
      s = newBullet(id, null, orderFirst(null, id), { isSession: true, date: today });
    }
    s.collapsed = false;

  } else {
    let k = childList(null, id);

}
function setChain(a, field, bId) {
  const other = field === 'prev' ? 'next' : 'prev';
  const old = a[field];
  if (old && S.containers[old] && S.containers[old][other] === a.id) S.containers[old][other] = null;
  a[field] = bId || null;
  if (bId) {
    const B = S.containers[bId];
    if (B[other] && B[other] !== a.id && S.containers[B[other]]) S.containers[B[other]][field] = null;
    B[other] = a.id;

}
function deleteContainer(c) {
  if (!confirm('Delete "' + (c.title || 'Untitled') + '" and all its notes?\n(Ctrl+Z undoes this.)')) return;
  snap();
  for (const b of Object.values(S.bullets)) if (b.containerId === c.id) delete S.bullets[b.id];
  setChain(c, 'prev', null); setChain(c, 'next', null);

  S.ui.current = null; save(); renderAll();
}

/* ---------- focus & caret ---------- */
function getCaret(node) {
  const s = getSelection(); if (!s.rangeCount) return 0;
  const r = s.getRangeAt(0); if (!node.contains(r.startContainer)) return 0;
  const pre = r.cloneRange(); pre.selectNodeContents(node); pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length;
}
function setCaret(node, pos) {
  const len = node.textContent.length;
  if (pos === 'end' || pos > len) pos = len;
  const r = document.createRange();
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  let n, left = pos, placed = false;
  while ((n = walker.nextNode())) { if (left <= n.length) { r.setStart(n, left); placed = true; break; } left -= n.length; }
  if (!placed) { r.selectNodeContents(node); r.collapse(false); } else r.collapse(true);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function focusInfo() {
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains('tx')) { const n = a.closest('.node'); return { id: n.dataset.id, pos: getCaret(a) }; }
  return null;
}
function txOf(id) { const n = document.querySelector('.node[data-id="' + id + '"]'); return n ? n.querySelector(':scope > .row > .tx') : null; }
function refocus(f) {
  if (!f) return;
  const t = txOf(f.id); if (!t) return;
  t.focus(); setCaret(t, f.pos);
  t.scrollIntoView({ block: 'nearest' });
}
function caretAtEdge(node, up) {
  const s = getSelection(); if (!s.rangeCount) return true;
  const r = s.getRangeAt(0).cloneRange(); r.collapse(true);
  const rect = r.getClientRects()[0]; if (!rect) return true;
  const er = node.getBoundingClientRect();
  const lh = parseFloat(getComputedStyle(node).lineHeight) || 22;
  return up ? rect.top - er.top < lh * 0.8 : er.bottom - rect.bottom < lh * 0.8;
}
function commit(focusId, pos) { save(); renderSidebar(); renderMain(); refocus({ id: focusId, pos }); }

const curView = () => (S.ui.current || S.ui.folder) ? null : (S.ui.view || 'today');
function todayCount() { // overdue + active today, for the sidebar badge
  const t = todayISO(); let n = 0, late = 0;
  for (const b of Object.values(S.bullets)) {
    if (b.isSession || b.done || (!b.start && !b.end) || !S.containers[b.containerId] || !(b.text || '').trim()) continue;
    if (isLate(b)) { n++; late++; } else if (onDay(b, t)) n++;
  }
  return { n, late };
}
function dayLog(d) { // meetings, documents and folders where something was written on day d
  const out = new Map(), get = cid => { if (!out.has(cid)) out.set(cid, { c: S.containers[cid], sess: [], n: 0 }); return out.get(cid); };
  for (const b of Object.values(S.bullets)) {
    if (!S.containers[b.containerId]) continue;
    if (b.isSession) { if (b.date === d && !treeEmpty(b.id)) get(b.containerId).sess.push(b); continue; }
    if (!(b.text || '').trim()) continue;
    const m = M['b:' + b.id];
    if ((b.created && dayOf(b.created) === d) || (m && m.mt > 1 && !m.del && dayOf(m.mt) === d)) get(b.containerId).n++;
  }
  return [...out.values()].sort((a, b) => (b.sess.length - a.sess.length) || (a.c.title || '').localeCompare(b.c.title || ''));
}

/* ---------- Today as one ranked list (stage 9) ----------
   Pool = open items that are overdue, active today or start within 7 days, plus undated open tasks linked to Me.
   b.rank (synced with the bullet) orders "My order"; pool items with no rank wait in "To rank".
   An item leaves the order when it's checked off or leaves the pool (date moved past 7 days, Me link removed);
   its rank is cleared then, so it comes back through To rank. */
function todayPool(d) {
  const end7 = addDays(d, 7), pool = new Map();
  for (const b of liveItems()) if (!b.done && (b.start || b.end) && (isLate(b) || onDay(b, d) || (spanOf(b).s > d && spanOf(b).s <= end7))) pool.set(b.id, b);
  for (const x of folderMembers('me')) { const b = x.b; if (!b.done && !b.start && !b.end && !isNote(x) && (b.text || '').trim()) pool.set(b.id, b); }
  return pool;
}
function pruneRanks(pool) { // quietly (no undo step): ranks of items that left the pool
  let n = 0;
  for (const b of Object.values(S.bullets)) if (b.rank != null && !pool.has(b.id)) { b.rank = null; n++; }
  if (n) save();
}
const byRank = (a, b) => a.rank - b.rank;
function toRankOrder(a, b) { // overdue first, then by the day they matter, then undated (oldest first)
  const ka = a.start || a.end ? (isLate(a) ? '0' + a.end : '1' + spanOf(a).s) : '2' + (a.created || '');
  const kb = b.start || b.end ? (isLate(b) ? '0' + b.end : '1' + spanOf(b).s) : '2' + (b.created || '');
  return ka.localeCompare(kb);
}
function renderRanked(ct, d) {
  const pool = todayPool(d); pruneRanks(pool);
  const items = [...pool.values()], ranked = items.filter(b => b.rank != null).sort(byRank), fresh = items.filter(b => b.rank == null).sort(toRankOrder);
  const idxCache = new Map(), idxOf = cid => { if (!idxCache.has(cid)) idxCache.set(cid, kidsIndex(cid)); return idxCache.get(cid); };
  const zone = (name, list, emptyText) => {
    const z = el('div', 'outline vgroup rkzone'); z.dataset.zone = name;
    if (!list.length) { const e = el('div', 'rkempty'); e.textContent = emptyText; z.appendChild(e); }
    for (const b of list) z.appendChild(rankItem(b, name, idxOf));
    ct.appendChild(z);
  };
  const h1 = vHeader(ct, 'day:torank', 'To rank', fresh.length, true, true);
  ct.lastChild.dataset.zone = 'torank';
  if (h1) zone('torank', fresh, 'Nothing new to rank. Drag an item here to take it out of your order.');
  vHeader(ct, 'day:mine', 'My order', ranked.length, false);
  ct.lastChild.dataset.zone = 'ranked';
  zone('ranked', ranked, fresh.length ? 'Drag items here from To rank by their ⠿ handle, in the order you want to do them.' : 'Nothing on your plate today. Items show up in To rank when they are overdue, active today, start within 7 days, or are open and linked to Me.');
}
function rankItem(b, zoneName, idxOf) {
  const w = el('div', 'rkit'); w.dataset.id = b.id;
  const s = el('div', 'src'); s.textContent = srcLabel(b); s.title = 'Open where this was written'; s.onclick = () => goToSource(b); w.appendChild(s);
  const n = nodeEl(b, idxOf(b.containerId), true); n.dataset.root = '1'; w.appendChild(n);
  const row = n.querySelector('.row');
  const h = el('span', 'rk'); h.textContent = '⠿'; h.title = 'Drag to set its place (on a phone: hold, then drag)'; row.insertBefore(h, row.firstChild);
  const bx = el('span', 'rkbtns');
  const btn = (t, title, fn) => { const x = el('button'); x.textContent = t; x.title = title; x.tabIndex = -1; x.onmousedown = e => e.preventDefault(); x.onclick = e => { e.stopPropagation(); fn(); }; bx.appendChild(x); };
  if (zoneName === 'ranked') { btn('↑', 'Move up', () => nudgeRank(b.id, -1)); btn('↓', 'Move down', () => nudgeRank(b.id, 1)); }
  else { btn('Top', 'Put at the top of My order', () => placeRank(b.id, 0)); btn('End', 'Put at the end of My order', () => placeRank(b.id, Infinity)); }
  row.appendChild(bx);
  return w;
}
function rankedNow() { const pool = todayPool(todayISO()); return [...pool.values()].filter(b => b.rank != null).sort(byRank); }
function placeRank(id, i) { // i = position in My order (Infinity = end); null = back to To rank
  const b = S.bullets[id]; if (!b) return;
  const list = rankedNow().filter(x => x.id !== id);
  snap();
  if (i === null) b.rank = null;

  const hit = document.elementFromPoint(x, y); if (!hit) return null;
  const it = hit.closest('.rkit'), z = hit.closest('[data-zone]');
  if (it && it.dataset.id !== rkd.id && it.closest('[data-zone="ranked"]')) { const r = it.getBoundingClientRect(); return { zone: 'ranked', el: it, side: y < r.top + r.height / 2 ? 'before' : 'after' }; }
  if (z && z.dataset.zone === 'torank') return { zone: 'torank', el: z };
  if (z && z.dataset.zone === 'ranked') { const box = content.querySelector('.rkzone[data-zone="ranked"]'); return { zone: 'ranked', el: box, end: z === box }; } // on the header = top, in the list's empty space = end
  return null;
}
function rkMark(t) {
  content.querySelectorAll('.rkit.drop-before,.rkit.drop-after,.rkzone.drop-in,.vsec.drop-in').forEach(n => n.classList.remove('drop-before', 'drop-after', 'drop-in'));
  if (!t) return;
  if (t.el.classList.contains('rkit')) t.el.classList.add('drop-' + t.side);
  else { t.el.classList.add('drop-in'); const h = content.querySelector('.vsec[data-zone="' + t.zone + '"]'); if (h) h.classList.add('drop-in'); }
}
function rkBegin() {
  rkd.started = true; rkd.it.classList.add('dragging'); document.body.classList.add('rkdragging');
  const g = rkd.it.querySelector('.row').cloneNode(true); g.className = 'row rkghost'; g.querySelectorAll('[contenteditable]').forEach(n => n.removeAttribute('contenteditable'));
  g.style.width = Math.min(rkd.it.getBoundingClientRect().width, window.innerWidth - 24) + 'px'; document.body.appendChild(g); rkd.ghost = g;
  if (navigator.vibrate && rkd.touch) try { navigator.vibrate(15); } catch (e) {}
  rkMove(); rkd.raf = requestAnimationFrame(rkScroll);
}
function rkMove() {
  rkd.ghost.style.left = Math.max(4, Math.min(rkd.x - 30, window.innerWidth - rkd.ghost.offsetWidth - 4)) + 'px'; rkd.ghost.style.top = (rkd.y - 14) + 'px';
  rkd.target = rkTarget(rkd.x, rkd.y); rkMark(rkd.target);
}
function rkScroll() { // near the top or bottom edge, scroll so long lists can be reordered
  if (!rkd || !rkd.started) return;
  const m = $('#main'), r = m.getBoundingClientRect(), edge = 60;
  const v = rkd.y < r.top + edge ? -Math.ceil((r.top + edge - rkd.y) / 4) : rkd.y > r.bottom - edge ? Math.ceil((rkd.y - r.bottom + edge) / 4) : 0;
  if (v) { m.scrollTop += v; rkMove(); }
  rkd.raf = requestAnimationFrame(rkScroll);
}
function rkEnd(drop) {
  if (!rkd) return;
  const d = rkd; rkd = null; clearTimeout(d.timer); cancelAnimationFrame(d.raf);
  document.body.classList.remove('rkdragging'); if (d.ghost) d.ghost.remove(); d.it.classList.remove('dragging'); rkMark(null);
  if (!drop || !d.started || !d.target) return;
  const t = d.target;
  if (t.zone === 'torank') { if (S.bullets[d.id].rank != null) placeRank(d.id, null); return; }
  const list = rankedNow().filter(x => x.id !== d.id);
  if (t.el.classList.contains('rkit')) { const i = list.findIndex(x => x.id === t.el.dataset.id); placeRank(d.id, i + (t.side === 'after' ? 1 : 0)); }
  else placeRank(d.id, t.end ? Infinity : 0);
}
content.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.rk'); if (!h || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault(); blurText();
  const it = h.closest('.rkit');
  rkd = { id: it.dataset.id, it, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse', started: false, timer: null };
  if (rkd.touch) rkd.timer = setTimeout(() => { if (rkd && !rkd.started) rkBegin(); }, 200);
});
document.addEventListener('pointermove', e => {
  if (!rkd) return;
  rkd.x = e.clientX; rkd.y = e.clientY;
  if (!rkd.started) {
    const dist = Math.hypot(e.clientX - rkd.x0, e.clientY - rkd.y0);
    if (!rkd.touch && dist > 4) rkBegin();
    else if (rkd.touch && dist > 12) rkEnd(false); // moved before the hold: treat as a scroll attempt, not a drag
    return;
  }
  e.preventDefault(); rkMove();
}, { passive: false });
document.addEventListener('pointerup', () => rkEnd(true));
document.addEventListener('pointercancel', () => rkEnd(false));
document.addEventListener('keydown', e => { if (rkd && e.key === 'Escape') rkEnd(false); });

lists.addEventListener('contextmenu', e => {
  const fi = e.target.closest('.item.folder'); if (!fi) return;
  e.preventDefault();
  const f = S.folders[fi.dataset.fid]; popFor = null;
  pop.innerHTML = '<div style="font-weight:600;margin-bottom:4px">' + esc(folderPath(f.id)) + '</div><div class="menu">' +
    '<button id="fOpen">Open</button><button id="fRen">Rename</button><button id="fSub">New sub-folder</button>' +
    (f.parentId ? '<button id="fTop">Move to top level</button>' : '') +
    (f.id !== 'me' ? '<button id="fMerge">Merge into…</button><button id="fDel">Delete…</button>' : '') + '</div>';
  placePop(e.clientX, e.clientY);
  $('#fOpen').onclick = () => { closePop(); openFolder(f.id); };
  $('#fRen').onclick = () => { closePop(); openFolder(f.id, true); const t = $('.head .title'); if (t) t.select(); };
  $('#fSub').onclick = () => { closePop(); newFolder(f.kind, f.id); };
  if ($('#fTop')) $('#fTop').onclick = () => { snap(); f.parentId = null; save(); closePop(); renderAll(); };
  if ($('#fMerge')) $('#fMerge').onclick = () => mergePop(f.id, e.clientX, e.clientY);
  if ($('#fDel')) $('#fDel').onclick = () => { closePop(); deleteFolder(f.id); };
});

/* ---------- sidebar & footer ---------- */
$('#homeBtn').onclick = () => goView('today', { day: null }); // Home is Today
/* sidebar toggle: wide screens hide/show it (remembered per browser); phones open it as a drawer */
$('#menuBtn').onclick = () => {
  if (narrowNav()) document.body.classList.toggle('navOpen');
  else { document.body.classList.toggle('navHidden'); try { localStorage.setItem('eccopim.navHidden', document.body.classList.contains('navHidden') ? '1' : ''); } catch (e) {} }
  syncNavBtn();
};
$('#navShade').onclick = closeNav;
try { if (localStorage.getItem('eccopim.navHidden')) document.body.classList.add('navHidden'); } catch (e) {}
narrowMQ.addEventListener && narrowMQ.addEventListener('change', () => { document.body.classList.remove('navOpen'); syncNavBtn(); });
syncNavBtn();
$('#reloadBtn').textContent = '↻ Refresh (' + (isMac ? '⌘R' : 'Ctrl+R') + ')';
$('#reloadBtn').onclick = () => { try { persist(); stamp(); } catch (e) {} location.reload(); };
$('#newMeeting').onclick = () => createContainer('meeting');
$('#newDoc').onclick = () => createContainer('document');
$('#filter').addEventListener('input', renderSidebar);
$('#toastUndo').onclick = () => { hideToast(); undo(); };

function exportData() {
  const data = JSON.stringify({ app: 'hinay', version: 2, exportedAt: new Date().toISOString(), containers: S.containers, bullets: S.bullets, folders: S.folders }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = 'pim-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  S.ui.lastExport = new Date().toISOString(); save(); renderBanner();
}
$('#exportBtn').onclick = exportData;
$('#usage').onclick = () => alert(usageText());
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o.containers !== 'object' || typeof o.bullets !== 'object') throw new Error('Not a backup file');
      const n = Object.values(o.containers).filter(c => c.type !== 'inbox').length, m = Object.keys(o.bullets).length, k = o.folders ? Object.keys(o.folders).length : 0;
      if (!confirm('Replace everything with this backup (' + n + ' meetings/files, ' + m + ' bullets, ' + k + ' people/projects)?' + (SY.connected ? '\nThis also replaces your notes in Drive and on your other laptops.' : '') + '\n(Ctrl+Z undoes this.)')) return;
      snap(); S.containers = fullColl('containers', o.containers); S.bullets = fullColl('bullets', o.bullets); S.folders = fullColl('folders', o.folders || {}); ensureModel(); S.ui.current = null; S.ui.folder = null; save(); renderAll();
    } catch (err) { alert('Could not import: ' + err.message); }
    e.target.value = '';
  };
  r.readAsText(f);
};

/* ---------- start ---------- */
(function startupCleanup() {
  for (const c of Object.values(S.containers)) {
    if (c.type !== 'meeting') continue;
    for (const s of sessionsOf(c.id)) if (!(c.id === S.ui.current && s.date === todayISO()) && treeEmpty(s.id)) deleteTree(s.id);
  }
})();
try { if (!sessionStorage.getItem('eccopim.tab')) { sessionStorage.setItem('eccopim.tab', '1'); S.ui.current = null; S.ui.folder = null; S.ui.view = 'today'; S.ui.day = null; } } catch (e) {}
if (S.ui.current && S.containers[S.ui.current]) openContainer(S.ui.current);
else { S.ui.current = null; if (S.ui.folder && !S.folders[S.ui.folder]) S.ui.folder = null; renderAll(); }
$('#syncBtn').onclick = () => { if (syncState === 'error' && token) syncNow(); else connect(); };
$('#confBtn').onclick = () => conflictsPop();
window.addEventListener('online', () => syncNow());
window.addEventListener('offline', () => { if (SY.connected) { syncState = 'offline'; showSync(); } });
// Keep a copy of the page in the browser so it opens without a network (needs sw.js next to index.html).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
// Ask the browser to keep Hinay's storage (notes not yet in Drive live there). Chrome decides silently; installing the app makes a yes likely.
if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist().catch(() => {}); }).catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) syncNow(); });
setInterval(() => { if (!document.hidden && (token || syncState === 'ok')) syncNow(); }, 60000); // pick up other laptops' edits
let shownDay = todayISO(); // after midnight, Today and the badge move to the new day
setInterval(() => { if (todayISO() === shownDay) return; shownDay = todayISO(); renderSidebar(); if (curView() && curView() !== 'search' && !focusInfo()) renderMain(); }, 60000);
showSync();
showUsage();
if (token) syncNow();
})();
</script>
